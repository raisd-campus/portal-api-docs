<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raisd Portal API</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.27.1/swagger-ui.css" />
  <style>
    html { box-sizing: border-box; }
    *, *::before, *::after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
    .topbar { display: none; }
    .raisd-header {
      max-width: 1460px;
      margin: 0 auto;
      padding: 24px 20px 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .raisd-header h1 {
      margin: 0 0 6px;
      font-size: 1.4rem;
      font-weight: 650;
    }
    .raisd-header p {
      margin: 0 0 8px;
      color: #444;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .raisd-header a { color: #1a4f8b; }
  </style>
</head>
<body>
  <header class="raisd-header">
    <h1>Raisd Portal API</h1>
    <p>
      Published OpenAPI:
      <a href="./openapi.yaml">openapi.yaml</a>
      · Spec repo:
      <a href="https://github.com/raisd-campus/portal-api-docs">portal-api-docs</a>
      · Service (private):
      <a href="https://github.com/raisd-campus/control-plane/tree/main/portal-api">control-plane/portal-api</a>
    </p>
    <p>
      Stage 1: bearer demo sessions and stub CMS acknowledgements.
      Point “Servers” at your local <code>http://127.0.0.1:8080</code> to try requests.
    </p>
  </header>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.27.1/swagger-ui-bundle.js" crossorigin></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "./openapi.yaml",
      dom_id: "#swagger-ui",
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout",
      tryItOutEnabled: true,
      persistAuthorization: true,
    });
  </script>
</body>
</html>
