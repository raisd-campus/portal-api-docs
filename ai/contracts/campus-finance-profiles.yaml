        studentTotal: [modularAdd, resource, repeat]
        standardTotal: [course, resource, repeat]
      cmsHardcodeNotes:
        - "b_Update_Student may set stdmodfee=600 or 375 on some repeat paths — keep CMS-side until override list agreed"
