      applies: true
      amountMinor: 30000
      currencyCode: LSL
      label: Application fee
      proofRequired: true
      verifiedByRole: bursary
      evidence: "Lesotho newer-CMS screenshot M300 VERIFIED — confirm exact Live amount"
      faid: null # accept | change | defer
    onlineEnrolmentPayment:
      proofRequired: true
      requestSourceCms: OnlineEnrollment
