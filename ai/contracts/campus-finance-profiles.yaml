# Shared fee-case catalogue (C1–C10). Campuses enable/override below.
feeCaseCatalog:
  - id: C1
    title: Zero module fee when status not chargeable
    cms: "r_zadstatus.adstatuschargable / r_zstdmodstatus.stdmodstatchargable = N"
    configKey: zeroWhenNotChargeable
  - id: C2
    title: Historical Exempted before cutover term
    cms: "stdmodstatcode=Exempted and termcode < cutover"
    configKey: exemptBeforeTerm
  - id: C3
    title: Semester catalogue fee
    cms: "f_semester.semesterfee → stdsemcrsfees when not modular"
    configKey: semesterBilling.mode includes semester
  - id: C4
    title: Modular sum of module fees
    cms: "sum(stdmodfee) when UseModularFee=Y"
    configKey: semesterBilling.mode includes modular
  - id: C5
    title: Repeat / ADD add-on fees
    cms: "semmodaddfees; campus hardcodes possible"
    configKey: components.modularAdd / repeat
  - id: C6
    title: Resource fees with exemptions
    cms: "stdsemresfees; exempt semester codes"
    configKey: components.resource
  - id: C7
    title: Deferred fee component
    cms: "StdSemDefFees / Deferred zeroes"
    configKey: components.deferred
  - id: C8
    title: Totals formula
    cms: "stdsemtotfees / StdSemStdrdFees"
    configKey: totals
  - id: C9
    title: Invoice lines from semester amounts
    cms: "b_invoicedetail"
    configKey: invoicing (CAP-53 later)
  - id: C10
    title: PayStatus vs outstanding
    cms: "r_student.paystatus / AccOutstanding"
    configKey: payStatusProjection (Student Finance)

