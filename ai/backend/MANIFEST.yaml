  - 2026-10-05: Lesotho M4 gap analysis — schema × frontend × flows in lesotho-db-gap.md (SDD-11 CAP IDs; admissions/registration/NMDS/finance/graduation); CAP seed reconciled in old-cms-lesotho.md; diagram #gap-x.
