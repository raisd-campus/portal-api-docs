  - 2026-10-05: Lesotho CMS analysis WG briefing — docs/reports/lesotho-cms-analysis-2026-10-05/ (HTML/PDF + WhatsApp paste); diagram hub banner + Pages sync.
  - 2026-10-05: Eswatini CMS pack inventoried — campus2_eswatini 472 tables / 330 views / 53 procs / 3 fns / 70 triggers; portal_*_eswatini + legacy _swaziland; assist ssb/limkokwing; M5 reference; dump under raisd/_local/.
