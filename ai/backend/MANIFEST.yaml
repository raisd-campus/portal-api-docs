  - 2026-09-27: Published HTML Primary nav + design-system subnav derive from docs/site-nav.yaml (build-dropdown-nav.py).
  - 2026-09-27: Portal API service split into raisd-campus/portal-api (history kept); openapi.yaml stays here. Added development plan, target deployment and PoC requirements under backend/.
  - 2026-10-01: Canonical record schema reviewed against LUCT reporting issues; proposed changes at backend/canonical-schema-luct-readiness.md. ERD generated columns now come from the Zod contract, not seed rows.
  - 2026-10-01: Schema v2 implemented (lifecycle, identifiers, access, finance corrections, audit_events, reporting views). Status updated in canonical-schema-luct-readiness.md §7; published ERD and PoC Neon notes refreshed.
  - 2026-10-01: Published pending confirmation agenda (CS-01–CS-13) at diagrams/canonical-schema-confirmations.html; linked from ERD, architecture status, SDD-10 Q29–Q36.
  - 2026-10-01: CS-01–CS-13 reframed — Schema v2 may proceed; campus-dependent answers become effective-dated policy (Live readiness). CS-12 Demo FKs deferred; CS-13 incremental report cutover. See canonical-schema-luct-readiness.md §0 / §6.
  - 2026-10-01: Schema v3 campus policy layer implemented (status mapping, academic-status / credit / CGPA / document / adjustment policies; university-default seeds; projections + SQL views). See canonical-schema-luct-readiness.md §0.1 / §7.
  - 2026-10-01: Campus policy surfaced in published ERD, Data Model Explorer, OpenAPI `/v1/meta.schemaVersion`, and db-admin IRREGULAR map.
  - 2026-10-01: "Architecture review confirmed Schema v3 good to proceed; CS-01–CS-11 = campus go-Live policy validation (Demo defaults not authoritative LUCT policy). Neon Demo reseeded to schema_version 3 (95 collections); physical verification checklist passed. Production Vercel portal-api redeployed — `/v1/meta` returns `schemaVersion: 3`."
  - 2026-10-01: LMS Q37 Option 1 — published lms-architecture.html + lms-features.html (F01–F37 × CAP) from Raisd sources; hub Moodle-like student map; no PPA comparison.
  - 2026-10-02: LMS logical database tables + ERD CMS/LMS/shared/proposed colour legend (erd.html §10); agent schema at backend/lms-schema.md.
  - 2026-10-02: db-admin ERD tab colours CMS / LMS / shared domains, domain filter, and LMS IRREGULAR stems (aligned with lms-schema.md).
  - 2026-10-02: Portal API LMS surface — OpenAPI tag `LMS`, `GET /v1/meta/lms` catalogue (callable Materials/assignment/lecturer-review + deferred CAP gaps); openapi 0.4.1.
  - 2026-10-03: Working Group weekly — Lesotho first pilot (supersedes Cyberjaya-first gate). architecture/lesotho-pilot.md + backend/old-cms-lesotho.md; SDD-00/01/02/03/09/10/14/15 updated; M4 = Lesotho pilot acceptance.
  - 2026-10-03: Lesotho newer-CMS screenshot pack analysed (WhatsApp); diagram hub docs/diagrams/old-cms-lesotho/; overview + lesotho-pilot.md emphasise sponsor/revenue/gov reasons from Read.ai.
  - 2026-10-04: Lesotho database gap (proxy) — backend/lesotho-db-gap.md + diagrams/old-cms-lesotho/#db-gap; UI→BW/CY→Schema until Vara old dump.
  - 2026-10-05: WhatsApp WG CMS 2026 re-probe — logical ERD + field matrix + gaps vs Schema v3 Demo in lesotho-db-gap.md; scale chips (~22.5k students, ~5.4k applicants).
  - 2026-10-05: Vara Lesotho CMS pack inventoried — campus2_lesotho 369 tables / 351 views / 51 procs / 6 fns; portal_student_*_lesotho + les_update_nmds; ~83% BW / ~81% CY table-name overlap; dump stays under raisd/_local/.
