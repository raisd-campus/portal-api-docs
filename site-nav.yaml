# Site search index (header magnifier → modal). href = target id or id#anchor.
# Regenerate publishes diagrams/site-search-index.json for the browser.
search:
  - title: Overview
    href: overview
    section: Overview
    summary: Diagrams hub for Control Plane — architecture maps, public endpoints, CMS inventories, and entry points to SDD and OpenAPI.
    keywords: [home, hub, diagrams, start, endpoints, urls, routes, api, public]

  - title: Project progress
    href: "overview#progress"
    section: Overview
    summary: High-level Raisd progress percentages — Live, frontend started, platform readiness, pending, blockers, bar/line/pie charts and delivery sequence table.
    keywords: [progress, percent, percentage, timeline, sequence, chart, blocker, pending, milestone, weekly, sponsor]

  - title: Distributed CMS target
    href: distributed
    section: Distributed CMS
    summary: Ideal multi-country Raisd CMS with distributed data planes, white-label packs, and feature flags.
    keywords: [ideal, multi-country, white-label, flags, tenancy]

  - title: Current → ideal journey
    href: "distributed#journey"
    section: Distributed CMS
    summary: Migration journey from today’s portal-on-CMS phase toward the unified distributed CMS.
    keywords: [journey, migration, roadmap]

  - title: Lesotho pilot approach
    href: ai-lesotho-pilot
    section: AI knowledge
    summary: First acceptance campus is Lesotho (3 Oct 2026). Feature benchmark from newer CMS screenshots; migration via Raisd schema + Lesotho CMS materials.
    keywords: [lesotho, pilot, m4, launch, acceptance, product-priority, eswatini]

  - title: Lesotho CMS inventory
