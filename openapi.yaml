  /v1/lecturer/getModuleDetails:
    post:
      tags: [LMS]
      operationId: lecturer_getModuleDetails
      summary: Read an assigned offering timetable and student roster
      description: |
        Read-only Demo projection from canonical records. A Lecturer bearer session,
        active role, campus scope and exact teaching assignment are required.
        Students follow Community's registered/active-enrolment membership rules.
        Student semesters come from each exact module registration's Study Period,
        not the current semester. No Year field or schema change is introduced.
        GET /v1/meta advertises capabilities.lecturerModuleDetailsVersion = 1;
        Lecturer login includes getModuleDetails in supportedMethods.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [moduleOfferingId]
              properties:
                moduleOfferingId: {type: string, minLength: 1}
      responses:
        '200':
          description: Canonical read-only Demo module details; no CMS write.
          content:
            application/json:
              schema:
                type: object
                required: [result, cms]
                properties:
                  result:
                    $ref: '#/components/schemas/LecturerModuleDetails'
                  cms:
                    type: object
                    properties:
                      acknowledged: {const: true}
                      mode: {const: stub}
                      note: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Lecturer role or account is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
        '404':
          description: Unknown, unassigned or out-of-campus offering.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
        '503':
          description: Canonical records are unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
  /v1/auth/lecturer/login:
    post:
      tags:
      - Auth
      operationId: lecturerDemoLogin
      summary: Create an existing Demo lecturer session
      description: Existing username/password sign-in; no authentication flow change. The bearer session also accesses
        Community when GET /v1/meta/community advertises support. supportedMethods retains the existing Lecturer RPC
        catalogue; shared Community methods are advertised separately.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Demo lecturer bearer session
          content:
            application/json:
              schema:
                type: object
                required:
                - accessToken
                - tokenType
                - expiresIn
                - staffMemberId
                - displayName
                - username
                - academicTitle
                - supportedMethods
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    const: Bearer
                  expiresIn:
                    type: integer
                    minimum: 0
                  staffMemberId:
                    type: string
                  displayName:
                    type: string
                  username:
                    type: string
                  academicTitle:
                    type: string
                  supportedMethods:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid login body
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Username or password is incorrect
          content:
            application/json:
              schema: *id001

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Token from `POST /v1/auth/login` or `POST /v1/auth/lecturer/login`; Community accepts both audiences.

  responses:
    BadRequest:
      description: Invalid body or PortalApi rejection
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unauthorized:
      description: Missing or expired bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: Session expired or missing. Sign in again.

  schemas:
    DemoDocumentResource:
      type: object
      additionalProperties: false
      required: [status, documentId, resourceId, fileName, mimeType, sizeBytes, sha256]
      properties:
        status: {type: string, const: resource}
        documentId: {type: string}
        resourceId: {type: string}
        fileName: {type: string}
        mimeType: {type: string}
        sizeBytes: {type: integer, minimum: 1, maximum: 26214400}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    DemoEvidenceUpload:
      type: object
      additionalProperties: false
      required: [id, name, mimeType, sizeBytes, sha256]
      properties:
        id: {type: string, minLength: 1, maxLength: 200}
        name: {type: string, minLength: 1, maxLength: 300}
        mimeType: {type: string, minLength: 1, maxLength: 200}
        sizeBytes: {type: integer, minimum: 1, maximum: 26214400}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        purpose: {type: string, enum: [admissions, message], default: admissions}
    DemoEvidenceChunk:
      type: object
      additionalProperties: false
      required: [id, offset, contentBase64]
      properties:
        id: {type: string, minLength: 1}
        offset: {type: integer, minimum: 0, multipleOf: 1048576}
        contentBase64: {type: string, maxLength: 1398104, pattern: '^[A-Za-z0-9+/]*={0,2}$'}
    DemoEvidenceRead:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, minLength: 1}
        offset: {type: integer, minimum: 0, default: 0}
    DemoEvidenceResource:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status, id, name, mimeType, sizeBytes, sha256, offset, contentBase64]
          properties:
            status: {type: string, const: available}
            id: {type: string}
            name: {type: string}
            mimeType: {type: string}
            sizeBytes: {type: integer, minimum: 1, maximum: 26214400}
            sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
            offset: {type: integer, minimum: 0}
            contentBase64: {type: string, maxLength: 1398104}
        - type: object
          additionalProperties: false
          required: [status, reason]
          properties:
            status: {type: string, const: unavailable}
            reason: {type: string}
    DemoContinuationInput:
      type: object
      additionalProperties: false
      required: [applicationId, expectedRevision, nonce, studentOrigin]
      properties:
        applicationId: {type: string, minLength: 1}
        expectedRevision: {type: integer, minimum: 1}
        nonce: {type: string, pattern: '^[a-f0-9]{32}$'}
        studentOrigin: {type: string, format: uri}
    DemoContinuationGrant:
      type: object
      additionalProperties: false
      required: [grant, expiresAt]
      properties:
        grant: {type: string, minLength: 32, maxLength: 128}
        expiresAt: {type: integer, minimum: 1, description: "Unix milliseconds, five minutes after issue"}
    ScenarioId:
      type: string
      enum:
        - mid-programme
        - first-semester-registration
        - new-student-pass
        - graduation-ready

    PortalMethod:
      type: string
      description: |
        Methods exposed by the student PortalApi interface
        (55 methods; matches student-portal frontend hooks).
      enum:
        - getImmigration
        - getOnlineForms
        - getOnlineForm
        - getOnlineFormSubmission
        - startOnlineForm
        - saveOnlineFormDraft
        - submitOnlineForm
        - withdrawOnlineForm
        - sendOnlineFormMessage
        - markOnlineFormRead
        - getAnnouncements
        - getAnnouncement
        - getUniversityPolicies
        - getLecturerReview
        - submitLecturerReview
        - getDashboard
        - getAcademicPerformance
        - getAcademicModules
        - getAcademicTimetable
        - getAcademicGraduation
        - getAcademicStudyPlan
        - getAcademicModuleRegistration
        - getModuleRegistrationFeePreview
        - confirmModuleRegistrations
        - getAcademicContext
        - getAcademicModuleDetail
        - getAcademicModuleAttendance
        - getAcademicModuleMaterials
        - getAcademicModuleMaterialDetail
        - submitAssignment
        - deleteAssignmentSubmission
        - getPersonalProfile
        - updatePersonalProfile
        - getAcademicProfile
        - getDocumentsProfile
        - getPrivacySecurity
        - getServices
        - getServicePage
        - getResumeProfile
        - updateResumeProfile
        - getPortfolioProfile
        - createPortfolioProject
        - updatePortfolioProject
        - deletePortfolioProject
        - getCommunity
        - getCalendarMonth
        - getFinanceStatement
        - submitFinancePaymentProof
        - deleteFinancePaymentProof
        - getChatConversations
        - getChatConversation
        - markChatConversationRead
        - sendChatMessage
        - deleteChatMessage

    HealthResponse:
      type: object
      required: [ok, service, mode, cms, time]
      properties:
        ok:
          type: boolean
        service:
          type: string
          example: portal-api
        mode:
          type: string
          example: stub-session
        sessions:
          type: string
          enum: [memory, postgres]
          description: Where session rows live. `postgres` when `DATABASE_URL` is set.
        data:
          type: string
          enum: [memory, postgres]
          description: Where Demo records live. `postgres` when `DATABASE_URL` is set.
        cms:
          type: string
          example: stub
        time:
          type: string
          format: date-time

    MetaResponse:
      type: object
      required: [service, version, scenarios, defaultScenarioId, cmsMode, docs, openapi]
      properties:
        service:
          type: string
        version:
          type: string
        schemaVersion:
          type: integer
          description: Portal record contract version (`PORTAL_RECORD_SCHEMA_VERSION`). A mismatch reseeds Demo record tables.
          example: 4
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioId"
        applicantScenarios:
          type: array
          items:
            type: string
            enum: [fresh, completed, approved]
        defaultScenarioId:
          $ref: "#/components/schemas/ScenarioId"
        defaultApplicantScenarioId:
          type: string
          enum: [fresh, completed, approved]
        cmsMode:
          type: string
          example: stub
        sessions:
          type: string
          enum: [memory, postgres]
        applicantSessions:
          type: string
          enum: [memory, postgres]
        data:
          type: string
          enum: [memory, postgres]
        applicantData:
          type: string
          enum: [memory, postgres]
        docs:
          type: string
          example: /docs
        openapi:
          type: string
          example: /openapi.yaml
        lms:
          type: string
          description: Path to the Demo LMS surface catalogue
          example: /v1/meta/lms
        applicant:
          type: string
          description: Path template for Applicant Demo RPC
          example: /v1/applicant/:method
        note:
          type: string

    LoginRequest:
      type: object
      required: [password]
      properties:
        email:
          type: string
          format: email
          description: |
            Preferred Demo login identity (maps to a scenario). Legacy `scenarioId`
            remains accepted during the transition.
        scenarioId:
          $ref: "#/components/schemas/ScenarioId"
        password:
          type: string
          minLength: 1
          description: |
            Demo password for the scenario's student (defaults to
            `first-semester-registration` when `scenarioId` and `email` are omitted).
            Passwords are not published; they are held in the gitignored
            `control-plane/.credentials/demo-students.json`.

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, scenarioId, studentProfileId]
      properties:
        accessToken:
          type: string
          format: uuid
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Seconds until the session expires
        scenarioId:
          $ref: "#/components/schemas/ScenarioId"
        studentProfileId:
          type: string

    ProgrammeEnrolmentReadInput:
      type: object
      description: Optional enrolment scope shared by most student-portal reads
