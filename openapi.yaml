      type: string
      enum: ["1", "2", "3", "4", "5"]

    ImmigrationResponse:
      type: object
      description: Demo wire contract for getImmigration (Zod immigrationResponseSchema).
      required:
        - studentProfileId
        - programmeEnrolmentId
        - campusId
        - timeZone
        - configured
        - applicable
        - officeName
        - passportCollectionLocation
        - currentPass
        - applicationActions
        - case
        - steps
        - recommendedStep
      properties:
        studentProfileId: { type: string, minLength: 1 }
        programmeEnrolmentId: { type: string, minLength: 1 }
        campusId: { type: string, minLength: 1 }
        timeZone: { type: string, minLength: 1 }
        configured: { type: boolean }
        applicable: { type: boolean }
        officeName: { type: ["string", "null"] }
        passportCollectionLocation: { type: ["string", "null"] }
        currentPass:
          type: ["object", "null"]
          required: [id, passType, passNumber, passportNumber, passportExpiresOn, passExpiresOn, status, cancelledAt]
          properties:
            id: { type: string, minLength: 1 }
            passType: { type: string, minLength: 1 }
            passNumber: { type: string, minLength: 1 }
            passportNumber: { type: string, minLength: 1 }
            passportExpiresOn: { type: string, format: date }
            passExpiresOn: { type: string, format: date }
            status: { type: string, enum: [valid, expiring, expired, cancelled] }
            cancelledAt: { type: ["string", "null"], format: date-time }
        applicationActions:
          type: array
          items:
            type: object
            required: [caseType, formId, label, available, reason]
            properties:
              caseType: { $ref: "#/components/schemas/ImmigrationCaseType" }
              formId: { type: string, minLength: 1 }
              label: { type: string, minLength: 1 }
              available: { type: boolean }
              reason: { type: ["string", "null"] }
        case:
          type: ["object", "null"]
          description: Extended Immigration case with invoice, documents, events, progress, medical form link
          required:
            - id
            - studentProfileId
            - programmeEnrolmentId
            - campusId
            - caseType
            - trigger
            - formSubmissionId
            - visaPassId
            - invoiceId
            - feeWaived
            - status
            - submittedAt
            - updatedAt
            - completedAt
            - updatedPassExpiresOn
            - medicalResult
            - revision
            - reference
            - invoice
            - invoicePaid
            - documents
            - events
            - progress
            - medicalFormSubmission
          properties:
            id: { type: string, minLength: 1 }
            studentProfileId: { type: string, minLength: 1 }
            programmeEnrolmentId: { type: string, minLength: 1 }
            campusId: { type: string, minLength: 1 }
            caseType: { $ref: "#/components/schemas/ImmigrationCaseType" }
            trigger: { type: string, enum: [student-requested, graduation, university-directed] }
            formSubmissionId: { type: ["string", "null"] }
            visaPassId: { type: ["string", "null"] }
            invoiceId: { type: ["string", "null"] }
            feeWaived: { type: boolean }
            status: { $ref: "#/components/schemas/ImmigrationCaseStatus" }
            submittedAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            completedAt: { type: ["string", "null"], format: date-time }
            updatedPassExpiresOn: { type: ["string", "null"], format: date }
            medicalResult:
              type: ["object", "null"]
              required: [id, name, mimeType, sizeBytes, submittedAt]
              properties:
                id: { type: string, minLength: 1 }
                name: { type: string, minLength: 1 }
                mimeType: { type: string, minLength: 1 }
                sizeBytes: { type: integer, minimum: 1 }
                submittedAt: { type: string, format: date-time }
            revision: { type: integer, minimum: 0 }
            reference: { type: ["string", "null"] }
            invoice: { oneOf: [{ $ref: "#/components/schemas/FinanceInvoice" }, { type: "null" }] }
            invoicePaid: { type: boolean }
            documents:
              type: array
              items: { $ref: "#/components/schemas/ImmigrationDocumentCheck" }
            events:
              type: array
              items: { $ref: "#/components/schemas/ImmigrationCaseEvent" }
            progress:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/ImmigrationProgressMilestone" }
            medicalFormSubmission:
              type: ["object", "null"]
              required: [id, status]
              properties:
                id: { type: string, minLength: 1 }
                status: { $ref: "#/components/schemas/OnlineFormStatus" }
        steps:
          type: array
          minItems: 3
          maxItems: 5
          items:
            type: object
            required: [value, label, title, complete, available]
            properties:
              value: { $ref: "#/components/schemas/ImmigrationStepValue" }
              label: { type: string, minLength: 1 }
              title: { type: string, minLength: 1 }
              complete: { type: boolean }
              available: { type: boolean }
        recommendedStep: { $ref: "#/components/schemas/ImmigrationStepValue" }

    ImmigrationDocumentCheck:
