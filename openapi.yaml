components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
      description: Token from `POST /v1/auth/login`

  responses:
    BadRequest:
      description: Invalid body or PortalApi rejection
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unauthorized:
      description: Missing or expired bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: Session expired or missing. Sign in again.

  schemas:
    ScenarioId:
      type: string
      enum:
        - mid-programme
        - first-semester-registration
        - new-student-pass
        - graduation-ready

    PortalMethod:
      type: string
      description: |
        Methods exposed by the student PortalApi interface
        (55 methods; matches student-portal frontend hooks).
      enum:
        - getImmigration
        - getOnlineForms
        - getOnlineForm
        - getOnlineFormSubmission
        - startOnlineForm
        - saveOnlineFormDraft
        - submitOnlineForm
        - withdrawOnlineForm
        - sendOnlineFormMessage
        - markOnlineFormRead
        - getAnnouncements
        - getAnnouncement
        - getUniversityPolicies
        - getLecturerReview
        - submitLecturerReview
        - getDashboard
        - getAcademicPerformance
        - getAcademicModules
        - getAcademicTimetable
        - getAcademicGraduation
        - getAcademicStudyPlan
        - getAcademicModuleRegistration
        - getModuleRegistrationFeePreview
        - confirmModuleRegistrations
        - getAcademicContext
        - getAcademicModuleDetail
        - getAcademicModuleAttendance
        - getAcademicModuleMaterials
        - getAcademicModuleMaterialDetail
        - submitAssignment
        - deleteAssignmentSubmission
        - getPersonalProfile
        - updatePersonalProfile
        - getAcademicProfile
        - getDocumentsProfile
        - getPrivacySecurity
        - getServices
        - getServicePage
        - getResumeProfile
        - updateResumeProfile
        - getPortfolioProfile
        - createPortfolioProject
        - updatePortfolioProject
        - deletePortfolioProject
        - getCommunity
        - getCalendarMonth
        - getFinanceStatement
        - submitFinancePaymentProof
        - deleteFinancePaymentProof
        - getPortalRecordGraph
        - getChatConversations
        - getChatConversation
        - markChatConversationRead
        - sendChatMessage
        - deleteChatMessage

    HealthResponse:
      type: object
      required: [ok, service, mode, cms, time]
      properties:
        ok:
          type: boolean
        service:
          type: string
          example: portal-api
        mode:
          type: string
          example: stub-session
        cms:
          type: string
          example: stub
        time:
          type: string
          format: date-time

    MetaResponse:
      type: object
      required: [service, version, scenarios, defaultScenarioId, cmsMode, docs, openapi]
      properties:
        service:
          type: string
        version:
          type: string
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioId"
        defaultScenarioId:
          $ref: "#/components/schemas/ScenarioId"
        cmsMode:
          type: string
          example: stub
        docs:
          type: string
          example: /docs
        openapi:
          type: string
          example: /openapi.yaml
        note:
          type: string

    LoginRequest:
      type: object
      properties:
        scenarioId:
          $ref: "#/components/schemas/ScenarioId"

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, scenarioId, studentProfileId]
      properties:
        accessToken:
          type: string
          format: uuid
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Seconds until the session expires
        scenarioId:
          $ref: "#/components/schemas/ScenarioId"
        studentProfileId:
          type: string

    ProgrammeEnrolmentReadInput:
      type: object
      description: Optional enrolment scope shared by most student-portal reads
      additionalProperties: false
      properties:
        programmeEnrolmentId:
          type: ["string", "null"]

    OnlineFormInput:
      type: object
      required: [formId]
      additionalProperties: false
      properties:
        formId:
          type: string
        programmeEnrolmentId:
          type: ["string", "null"]

    OnlineFormSubmissionInput:
      type: object
      required: [submissionId]
      additionalProperties: false
      properties:
        submissionId:
          type: string
        programmeEnrolmentId:
          type: ["string", "null"]

    SaveOnlineFormDraftInput:
      allOf:
        - $ref: "#/components/schemas/OnlineFormSubmissionInput"
        - type: object
          required: [answers, revision]
          properties:
            answers:
              type: object
              additionalProperties: true
            revision:
              type: integer
              minimum: 0

    SubmitOnlineFormInput:
      allOf:
        - $ref: "#/components/schemas/OnlineFormSubmissionInput"
        - type: object
          required: [revision]
          properties:
            revision:
              type: integer
              minimum: 0

    SendOnlineFormMessageInput:
      allOf:
        - $ref: "#/components/schemas/OnlineFormSubmissionInput"
        - type: object
          required: [text, attachments, clientMessageId]
          properties:
            text:
              type: string
              maxLength: 10000
            attachments:
              type: array
              items:
                type: object
            clientMessageId:
              type: string

    MarkOnlineFormReadInput:
      allOf:
        - $ref: "#/components/schemas/OnlineFormSubmissionInput"
        - type: object
          required: [throughSequence]
          properties:
            throughSequence:
              type: integer
              minimum: 0

    AnnouncementInput:
      type: object
      required: [announcementId]
      properties:
        announcementId:
          type: string
        programmeEnrolmentId:
          type: ["string", "null"]

    LecturerReviewInput:
      type: object
      required: [moduleId, semesterId, lecturerId]
      properties:
        moduleId:
          type: string
        semesterId:
          type: string
        lecturerId:
          type: string
        programmeEnrolmentId:
          type: ["string", "null"]

    SubmitLecturerReviewInput:
      allOf:
        - $ref: "#/components/schemas/LecturerReviewInput"
        - type: object
          required: [questionnaireId, questionnaireVersion, answers, feedback]
          properties:
            questionnaireId:
              type: string
            questionnaireVersion:
              type: integer
              minimum: 1
            answers:
              type: object
              additionalProperties:
                type: integer
                minimum: 1
                maximum: 5
            feedback:
              type: string
              maxLength: 2000

    AcademicTimetableInput:
      type: object
      properties:
        semesterId:
          type: ["string", "null"]
        programmeEnrolmentId:
          type: ["string", "null"]

    AcademicModuleDetailInput:
      type: object
      required: [moduleId, semesterId]
      properties:
        moduleId:
          type: string
        semesterId:
          type: string
        programmeEnrolmentId:
          type: ["string", "null"]

    AcademicModuleMaterialDetailInput:
      allOf:
        - $ref: "#/components/schemas/AcademicModuleDetailInput"
        - type: object
          required: [moduleLearningItemId]
          properties:
            moduleLearningItemId:
              type: string

    SubmitAssignmentInput:
      allOf:
        - $ref: "#/components/schemas/AcademicModuleMaterialDetailInput"
        - type: object
          required: [file]
          properties:
            file:
              $ref: "#/components/schemas/PortalFile"

    DeleteAssignmentSubmissionInput:
      $ref: "#/components/schemas/AcademicModuleMaterialDetailInput"

    ModuleRegistrationSelectionInput:
      type: object
      required: [studyPeriodId, moduleOfferingIds]
      properties:
        studyPeriodId:
          type: string
        moduleOfferingIds:
          type: array
          minItems: 1
          items:
            type: string

    ModuleRegistrationFeePreviewInput:
      $ref: "#/components/schemas/ModuleRegistrationSelectionInput"

    ConfirmModuleRegistrationsInput:
      $ref: "#/components/schemas/ModuleRegistrationSelectionInput"

    ServicePageInput:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
        programmeEnrolmentId:
          type: ["string", "null"]

    CalendarMonthInput:
      type: object
      required: [semesterId, month]
      properties:
        semesterId:
          type: string
        month:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
          example: "2026-09"
        programmeEnrolmentId:
          type: ["string", "null"]

    PersonalAddress:
      type: object
      required: [addressLine, country, state, city, postcode]
      properties:
        addressLine:
          type: string
        country:
          type: string
        state:
          type: string
        city:
          type: string
        postcode:
          type: string

    UpdatePersonalProfileInput:
      type: object
      required:
        - contactNumber
        - maritalStatus
        - emailAddress
        - permanentAddress
        - currentAddress
        - emergencyContacts
      properties:
        contactNumber:
          type: string
        maritalStatus:
          type: string
          enum: [single, married, divorced, widowed]
        emailAddress:
          type: string
          format: email
        permanentAddress:
          $ref: "#/components/schemas/PersonalAddress"
        currentAddress:
          $ref: "#/components/schemas/PersonalAddress"
        emergencyContacts:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, relationship, contactNumber]
            properties:
              name:
                type: string
              relationship:
                type: string
              contactNumber:
                type: string

    UpdateResumeProfileInput:
      type: object
      required: [professionalSummary, workExperiences, educations, skills, recognitions]
      properties:
        professionalSummary:
          type: ["string", "null"]
        workExperiences:
          type: array
          items:
            type: object
        educations:
          type: array
          items:
            type: object
        skills:
          type: array
          items:
            type: object
        recognitions:
          type: array
          items:
            type: object

    CreatePortfolioProjectInput:
      type: object
      required: [name, createdOn, description, toolsUsed, artwork]
      properties:
        name:
          type: string
        createdOn:
          type: string
          format: date
        description:
          type: string
        toolsUsed:
          type: array
          items:
            type: string
        artwork:
          $ref: "#/components/schemas/PortalFile"

    UpdatePortfolioProjectInput:
      type: object
      required: [id, name, createdOn, description, toolsUsed, artwork]
      properties:
        id:
          type: string
        name:
          type: string
        createdOn:
          type: string
          format: date
        description:
          type: string
        toolsUsed:
          type: array
          items:
            type: string
        artwork:
          oneOf:
            - $ref: "#/components/schemas/PortalFile"
            - type: "null"

    DeletePortfolioProjectInput:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: string

    SubmitFinancePaymentProofInput:
      type: object
      required: [invoiceId, amountMinor, transferDate, bankReference, file]
      properties:
        invoiceId:
          type: string
        programmeEnrolmentId:
          type: ["string", "null"]
        amountMinor:
          type: integer
          minimum: 1
        transferDate:
          type: string
          format: date
        bankReference:
          type: string
        file:
          $ref: "#/components/schemas/PortalFile"

    DeleteFinancePaymentProofInput:
      type: object
      required: [invoiceId]
      properties:
        invoiceId:
          type: string
        programmeEnrolmentId:
          type: ["string", "null"]

    ChatTarget:
      oneOf:
        - type: object
          required: [kind, context]
          properties:
            kind:
              const: group
            context:
              type: object
        - type: object
          required: [kind, personId]
          properties:
            kind:
              const: personal
            personId:
              type: string
        - type: object
          required: [kind, serviceId]
          properties:
            kind:
              const: service
            serviceId:
              type: string

    SendChatMessageInput:
      type: object
      required: [target, text, attachments]
      properties:
        target:
          $ref: "#/components/schemas/ChatTarget"
        text:
          type: string
        attachments:
          type: array
          items:
            type: object
        programmeEnrolmentId:
          type: ["string", "null"]

    PortalCallRequest:
      type: object
      required: [args]
      properties:
        args:
          type: array
          description: |
            Positional arguments for the PortalApi method.
            Typed request schemas (see PortalRequestSchemaIndex) document the
            shapes of object arguments. File values use PortalFile.
          items: true
        _schemaIndex:
          description: Docs-only index of typed request bodies (not sent on the wire)
          $ref: "#/components/schemas/PortalRequestSchemaIndex"

    PortalRequestSchemaIndex:
      type: object
      description: Named PortalApi request shapes used by student-portal
      properties:
        programmeEnrolmentReadInput:
          $ref: "#/components/schemas/ProgrammeEnrolmentReadInput"
        onlineFormInput:
          $ref: "#/components/schemas/OnlineFormInput"
        onlineFormSubmissionInput:
          $ref: "#/components/schemas/OnlineFormSubmissionInput"
        saveOnlineFormDraftInput:
          $ref: "#/components/schemas/SaveOnlineFormDraftInput"
        submitOnlineFormInput:
          $ref: "#/components/schemas/SubmitOnlineFormInput"
        sendOnlineFormMessageInput:
          $ref: "#/components/schemas/SendOnlineFormMessageInput"
        markOnlineFormReadInput:
          $ref: "#/components/schemas/MarkOnlineFormReadInput"
        announcementInput:
          $ref: "#/components/schemas/AnnouncementInput"
        lecturerReviewInput:
          $ref: "#/components/schemas/LecturerReviewInput"
        submitLecturerReviewInput:
          $ref: "#/components/schemas/SubmitLecturerReviewInput"
        academicTimetableInput:
          $ref: "#/components/schemas/AcademicTimetableInput"
        academicModuleDetailInput:
          $ref: "#/components/schemas/AcademicModuleDetailInput"
        academicModuleMaterialDetailInput:
          $ref: "#/components/schemas/AcademicModuleMaterialDetailInput"
        submitAssignmentInput:
          $ref: "#/components/schemas/SubmitAssignmentInput"
        deleteAssignmentSubmissionInput:
          $ref: "#/components/schemas/DeleteAssignmentSubmissionInput"
        moduleRegistrationFeePreviewInput:
          $ref: "#/components/schemas/ModuleRegistrationFeePreviewInput"
        confirmModuleRegistrationsInput:
          $ref: "#/components/schemas/ConfirmModuleRegistrationsInput"
        servicePageInput:
          $ref: "#/components/schemas/ServicePageInput"
        calendarMonthInput:
          $ref: "#/components/schemas/CalendarMonthInput"
        updatePersonalProfileInput:
          $ref: "#/components/schemas/UpdatePersonalProfileInput"
        updateResumeProfileInput:
          $ref: "#/components/schemas/UpdateResumeProfileInput"
        createPortfolioProjectInput:
          $ref: "#/components/schemas/CreatePortfolioProjectInput"
        updatePortfolioProjectInput:
          $ref: "#/components/schemas/UpdatePortfolioProjectInput"
        deletePortfolioProjectInput:
          $ref: "#/components/schemas/DeletePortfolioProjectInput"
        submitFinancePaymentProofInput:
          $ref: "#/components/schemas/SubmitFinancePaymentProofInput"
        deleteFinancePaymentProofInput:
          $ref: "#/components/schemas/DeleteFinancePaymentProofInput"
        sendChatMessageInput:
          $ref: "#/components/schemas/SendChatMessageInput"
        chatTarget:
          $ref: "#/components/schemas/ChatTarget"
        personalAddress:
          $ref: "#/components/schemas/PersonalAddress"
        moduleRegistrationSelectionInput:
          $ref: "#/components/schemas/ModuleRegistrationSelectionInput"

    PortalFile:
      type: object
      required: [__portalFile, name, type, size]
      properties:
        __portalFile:
          type: boolean
          const: true
        name:
          type: string
        type:
          type: string
          example: application/pdf
        size:
          type: integer
          minimum: 0
        contentBase64:
          type: string
          description: Optional file bytes as base64

    CmsAck:
      type: object
      required: [acknowledged, mode]
      properties:
        acknowledged:
          type: boolean
        mode:
          type: string
          enum: [stub, live]
        note:
          type: string

    PortalCallResponse:
      type: object
      required: [result, cms]
      properties:
        result:
          description: |
            PortalApi return value for the invoked method.
            Shapes live in student-portal `src/contracts/*` (Zod schemas).
            Per-method response OpenAPI components are deferred until CAP-53
            freezes the live CMS contracts.
        cms:
          $ref: "#/components/schemas/CmsAck"

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details: {}
