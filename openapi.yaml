components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
      description: Token from `POST /v1/auth/login`

  responses:
    BadRequest:
      description: Invalid body or PortalApi rejection
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unauthorized:
      description: Missing or expired bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: Session expired or missing. Sign in again.

  schemas:
    ScenarioId:
      type: string
      enum:
        - mid-programme
        - first-semester-registration
        - new-student-pass
        - graduation-ready

    PortalMethod:
      type: string
      description: |
        Methods exposed by the student PortalApi interface
        (55 methods; matches student-portal frontend hooks).
      enum:
        - getImmigration
        - getOnlineForms
        - getOnlineForm
        - getOnlineFormSubmission
        - startOnlineForm
        - saveOnlineFormDraft
        - submitOnlineForm
        - withdrawOnlineForm
        - sendOnlineFormMessage
        - markOnlineFormRead
        - getAnnouncements
        - getAnnouncement
        - getUniversityPolicies
        - getLecturerReview
        - submitLecturerReview
        - getDashboard
        - getAcademicPerformance
        - getAcademicModules
        - getAcademicTimetable
        - getAcademicGraduation
        - getAcademicStudyPlan
        - getAcademicModuleRegistration
        - getModuleRegistrationFeePreview
        - confirmModuleRegistrations
        - getAcademicContext
        - getAcademicModuleDetail
        - getAcademicModuleAttendance
        - getAcademicModuleMaterials
        - getAcademicModuleMaterialDetail
        - submitAssignment
        - deleteAssignmentSubmission
        - getPersonalProfile
        - updatePersonalProfile
        - getAcademicProfile
        - getDocumentsProfile
        - getPrivacySecurity
        - getServices
        - getServicePage
        - getResumeProfile
        - updateResumeProfile
        - getPortfolioProfile
        - createPortfolioProject
        - updatePortfolioProject
        - deletePortfolioProject
        - getCommunity
        - getCalendarMonth
        - getFinanceStatement
        - submitFinancePaymentProof
        - deleteFinancePaymentProof
        - getPortalRecordGraph
        - getChatConversations
        - getChatConversation
        - markChatConversationRead
        - sendChatMessage
        - deleteChatMessage

    HealthResponse:
      type: object
      required: [ok, service, mode, cms, time]
      properties:
        ok:
          type: boolean
        service:
          type: string
          example: portal-api
        mode:
          type: string
          example: stub-session
        sessions:
          type: string
          enum: [memory, postgres]
          description: Where session rows live. `postgres` when `DATABASE_URL` is set.
        data:
          type: string
          enum: [memory, postgres]
          description: Where Demo records live. `postgres` when `DATABASE_URL` is set.
        cms:
          type: string
          example: stub
        time:
          type: string
          format: date-time

    MetaResponse:
      type: object
      required: [service, version, scenarios, defaultScenarioId, cmsMode, docs, openapi]
      properties:
        service:
          type: string
        version:
          type: string
        schemaVersion:
          type: integer
          description: Portal record contract version (`PORTAL_RECORD_SCHEMA_VERSION`). A mismatch reseeds Demo record tables.
          example: 4
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioId"
        applicantScenarios:
          type: array
          items:
            type: string
            enum: [fresh, completed, approved]
        defaultScenarioId:
          $ref: "#/components/schemas/ScenarioId"
        defaultApplicantScenarioId:
          type: string
          enum: [fresh, completed, approved]
        cmsMode:
          type: string
          example: stub
        sessions:
          type: string
          enum: [memory, postgres]
        applicantSessions:
          type: string
          enum: [memory, postgres]
        data:
          type: string
          enum: [memory, postgres]
        applicantData:
          type: string
          enum: [memory, postgres]
        docs:
          type: string
          example: /docs
        openapi:
          type: string
          example: /openapi.yaml
        lms:
          type: string
          description: Path to the Demo LMS surface catalogue
          example: /v1/meta/lms
        applicant:
          type: string
          description: Path template for Applicant Demo RPC
          example: /v1/applicant/:method
        note:
          type: string

    LoginRequest:
      type: object
      required: [password]
      properties:
        scenarioId:
          $ref: "#/components/schemas/ScenarioId"
        password:
          type: string
          minLength: 1
          description: |
            Demo password for the scenario's student (defaults to
            `first-semester-registration` when `scenarioId` is omitted).
            Passwords are not published; they are held in the gitignored
            `control-plane/.credentials/demo-students.json`.

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, scenarioId, studentProfileId]
      properties:
        accessToken:
          type: string
          format: uuid
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Seconds until the session expires
        scenarioId:
          $ref: "#/components/schemas/ScenarioId"
        studentProfileId:
          type: string

    ProgrammeEnrolmentReadInput:
      type: object
      description: Optional enrolment scope shared by most student-portal reads
      additionalProperties: false
      properties:
        programmeEnrolmentId:
          type: ["string", "null"]

    OnlineFormInput:
      type: object
      required: [formId]
      additionalProperties: false
      properties:
        formId:
          type: string
        programmeEnrolmentId:
          type: ["string", "null"]

    OnlineFormSubmissionInput:
      type: object
      required: [submissionId]
      additionalProperties: false
      properties:
        submissionId:
          type: string
        programmeEnrolmentId:
          type: ["string", "null"]

    SaveOnlineFormDraftInput:
      allOf:
        - $ref: "#/components/schemas/OnlineFormSubmissionInput"
        - type: object
          required: [answers, revision]
          properties:
            answers:
              type: object
              additionalProperties: true
            revision:
              type: integer
              minimum: 0

    SubmitOnlineFormInput:
      allOf:
        - $ref: "#/components/schemas/OnlineFormSubmissionInput"
        - type: object
          required: [revision]
          properties:
            revision:
              type: integer
              minimum: 0

    SendOnlineFormMessageInput:
      allOf:
        - $ref: "#/components/schemas/OnlineFormSubmissionInput"
        - type: object
          required: [text, attachments, clientMessageId]
          properties:
            text:
              type: string
              maxLength: 10000
            attachments:
              type: array
              maxItems: 5
              description: |
                Max 5 files, 25 MiB each, 75 MiB total (enforced by Zod /
                MockPortalApi). Matches student-portal onlineFormAttachmentsSchema.
              items:
                $ref: "#/components/schemas/OnlineFormAttachment"
            clientMessageId:
              type: string

    MarkOnlineFormReadInput:
      allOf:
        - $ref: "#/components/schemas/OnlineFormSubmissionInput"
        - type: object
          required: [throughSequence]
          properties:
            throughSequence:
              type: integer
              minimum: 0

    AnnouncementInput:
      type: object
      required: [announcementId]
      properties:
        announcementId:
          type: string
        programmeEnrolmentId:
          type: ["string", "null"]

    LecturerReviewInput:
      type: object
      required: [moduleId, semesterId, lecturerId]
      properties:
        moduleId:
          type: string
        semesterId:
          type: string
        lecturerId:
          type: string
        programmeEnrolmentId:
          type: ["string", "null"]

    SubmitLecturerReviewInput:
      allOf:
        - $ref: "#/components/schemas/LecturerReviewInput"
        - type: object
          required: [questionnaireId, questionnaireVersion, answers, feedback]
          properties:
            questionnaireId:
              type: string
            questionnaireVersion:
              type: integer
              minimum: 1
            answers:
              type: object
              additionalProperties:
                type: integer
                minimum: 1
                maximum: 5
            feedback:
              type: string
              maxLength: 2000

    AcademicTimetableInput:
      type: object
      properties:
        semesterId:
          type: ["string", "null"]
        programmeEnrolmentId:
          type: ["string", "null"]

    AcademicModuleDetailInput:
      type: object
      required: [moduleId, semesterId]
      properties:
        moduleId:
          type: string
        semesterId:
          type: string
        programmeEnrolmentId:
          type: ["string", "null"]

    AcademicModuleMaterialDetailInput:
      allOf:
        - $ref: "#/components/schemas/AcademicModuleDetailInput"
        - type: object
          required: [moduleLearningItemId]
          properties:
            moduleLearningItemId:
              type: string

    SubmitAssignmentInput:
      allOf:
        - $ref: "#/components/schemas/AcademicModuleMaterialDetailInput"
        - type: object
          required: [file]
          properties:
            file:
              $ref: "#/components/schemas/PortalFile"

    DeleteAssignmentSubmissionInput:
      $ref: "#/components/schemas/AcademicModuleMaterialDetailInput"

    ModuleRegistrationSelectionInput:
      type: object
      required: [studyPeriodId, moduleOfferingIds]
      properties:
        studyPeriodId:
          type: string
        moduleOfferingIds:
          type: array
          minItems: 1
          items:
            type: string

    ModuleRegistrationFeePreviewInput:
      $ref: "#/components/schemas/ModuleRegistrationSelectionInput"

    ConfirmModuleRegistrationsInput:
      $ref: "#/components/schemas/ModuleRegistrationSelectionInput"

    ServicePageInput:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
        programmeEnrolmentId:
          type: ["string", "null"]

    CalendarMonthInput:
      type: object
      required: [semesterId, month]
      properties:
        semesterId:
          type: string
        month:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
          example: "2026-09"
        programmeEnrolmentId:
          type: ["string", "null"]

    PersonalAddress:
      type: object
      required: [addressLine, country, state, city, postcode]
      properties:
        addressLine:
          type: string
        country:
          type: string
        state:
          type: string
        city:
          type: string
        postcode:
          type: string

    UpdatePersonalProfileInput:
      type: object
      properties:
        fatherGuardian:
          anyOf:
          - type: object
            properties:
              fullName:
                type: string
                minLength: 1
              contactNumber:
                type: string
                minLength: 7
              emailAddress:
                type: string
                format: email
                pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            required:
            - fullName
            - contactNumber
            - emailAddress
          - type: 'null'
        motherGuardian:
          anyOf:
          - type: object
            properties:
              fullName:
                type: string
                minLength: 1
              contactNumber:
                type: string
                minLength: 7
              emailAddress:
                type: string
                format: email
                pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            required:
            - fullName
            - contactNumber
            - emailAddress
          - type: 'null'
        disabilityAnswer:
          anyOf:
          - type: string
            enum:
            - 'yes'
            - 'no'
          - type: 'null'
        disabilityDetails:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        contactNumber:
          type: string
          minLength: 7
        maritalStatus:
          type: string
          enum:
          - single
          - married
          - divorced
          - widowed
        emailAddress:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        permanentAddress:
          type: object
          properties:
            addressLine:
              type: string
              minLength: 1
            country:
              type: string
              minLength: 1
            state:
              type: string
              minLength: 1
            city:
              type: string
              minLength: 1
            postcode:
              type: string
              minLength: 1
          required:
          - addressLine
          - country
          - state
          - city
          - postcode
        currentAddress:
          type: object
          properties:
            addressLine:
              type: string
              minLength: 1
            country:
              type: string
              minLength: 1
            state:
              type: string
              minLength: 1
            city:
              type: string
              minLength: 1
            postcode:
              type: string
              minLength: 1
          required:
          - addressLine
          - country
          - state
          - city
          - postcode
        emergencyContacts:
          minItems: 1
          type: array
          items:
            type: object
            properties:
              relationship:
                default: null
                anyOf:
                - type: string
                  minLength: 1
                - type: 'null'
              id:
                anyOf:
                - type: string
                  minLength: 1
                - type: 'null'
              fullName:
                type: string
                minLength: 1
              contactNumber:
                type: string
                minLength: 7
              emailAddress:
                type: string
                format: email
                pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            required:
            - id
            - fullName
            - contactNumber
            - emailAddress
      required:
      - contactNumber
      - maritalStatus
      - emailAddress
      - permanentAddress
      - currentAddress
      - emergencyContacts
      additionalProperties: false
      description: Actual editable Student profile payload. Legacy requests may omit new guardian/disability
        fields; omission preserves canonical values. Explicit null clears an optional value. Disability details
        are required when answered yes. Official identity and religion are locked. Hosted support requires
        the schema-v4 engine upgrade.
    UpdateResumeProfileInput:
      type: object
      required: [professionalSummary, workExperiences, educations, skills, recognitions]
      properties:
        professionalSummary:
          type: ["string", "null"]
        workExperiences:
          type: array
          items:
            type: object
        educations:
          type: array
          items:
            type: object
        skills:
          type: array
          items:
            type: object
        recognitions:
          type: array
          items:
            type: object

    CreatePortfolioProjectInput:
      type: object
      required: [name, createdOn, description, toolsUsed, artwork]
      properties:
        name:
          type: string
        createdOn:
          type: string
          format: date
        description:
          type: string
        toolsUsed:
          type: array
          items:
            type: string
        artwork:
          $ref: "#/components/schemas/PortalFile"

    UpdatePortfolioProjectInput:
      type: object
      required: [id, name, createdOn, description, toolsUsed, artwork]
      properties:
        id:
          type: string
        name:
          type: string
        createdOn:
          type: string
          format: date
        description:
          type: string
        toolsUsed:
          type: array
          items:
            type: string
        artwork:
          oneOf:
            - $ref: "#/components/schemas/PortalFile"
            - type: "null"

    DeletePortfolioProjectInput:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: string

    SubmitFinancePaymentProofInput:
      type: object
      required: [invoiceId, amountMinor, transferDate, bankReference, file]
      properties:
        invoiceId:
          type: string
        programmeEnrolmentId:
          type: ["string", "null"]
        amountMinor:
          type: integer
          minimum: 1
        transferDate:
          type: string
          format: date
        bankReference:
          type: string
        file:
          $ref: "#/components/schemas/PortalFile"

    DeleteFinancePaymentProofInput:
      type: object
      required: [invoiceId]
      properties:
        invoiceId:
          type: string
        programmeEnrolmentId:
          type: ["string", "null"]

    ChatTarget:
      oneOf:
        - type: object
          required: [kind, context]
          properties:
            kind:
              const: group
            context:
              type: object
        - type: object
          required: [kind, personId]
          properties:
            kind:
              const: personal
            personId:
              type: string
        - type: object
          required: [kind, serviceId]
          properties:
            kind:
              const: service
            serviceId:
              type: string

    SendChatMessageInput:
      type: object
      required: [target, text, attachments]
      properties:
        target:
          $ref: "#/components/schemas/ChatTarget"
        text:
          type: string
        attachments:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/OnlineFormAttachment"
        programmeEnrolmentId:
          type: ["string", "null"]

    PortalCallRequest:
      type: object
      required: [args]
      properties:
        args:
          type: array
          description: |
            Positional arguments for the PortalApi method.
            Typed request schemas (see PortalRequestSchemaIndex) document the
            shapes of object arguments. File values use PortalFile.
          items: true
        _schemaIndex:
          description: Docs-only index of typed request bodies (not sent on the wire)
          $ref: "#/components/schemas/PortalRequestSchemaIndex"

    PortalRequestSchemaIndex:
      type: object
      description: Named PortalApi request shapes used by student-portal
      properties:
        programmeEnrolmentReadInput:
          $ref: "#/components/schemas/ProgrammeEnrolmentReadInput"
        onlineFormInput:
          $ref: "#/components/schemas/OnlineFormInput"
        onlineFormSubmissionInput:
          $ref: "#/components/schemas/OnlineFormSubmissionInput"
        saveOnlineFormDraftInput:
          $ref: "#/components/schemas/SaveOnlineFormDraftInput"
        submitOnlineFormInput:
          $ref: "#/components/schemas/SubmitOnlineFormInput"
        sendOnlineFormMessageInput:
          $ref: "#/components/schemas/SendOnlineFormMessageInput"
        markOnlineFormReadInput:
          $ref: "#/components/schemas/MarkOnlineFormReadInput"
        announcementInput:
          $ref: "#/components/schemas/AnnouncementInput"
        lecturerReviewInput:
          $ref: "#/components/schemas/LecturerReviewInput"
        submitLecturerReviewInput:
          $ref: "#/components/schemas/SubmitLecturerReviewInput"
        academicTimetableInput:
          $ref: "#/components/schemas/AcademicTimetableInput"
        academicModuleDetailInput:
          $ref: "#/components/schemas/AcademicModuleDetailInput"
        academicModuleMaterialDetailInput:
          $ref: "#/components/schemas/AcademicModuleMaterialDetailInput"
        submitAssignmentInput:
          $ref: "#/components/schemas/SubmitAssignmentInput"
        deleteAssignmentSubmissionInput:
          $ref: "#/components/schemas/DeleteAssignmentSubmissionInput"
        moduleRegistrationFeePreviewInput:
          $ref: "#/components/schemas/ModuleRegistrationFeePreviewInput"
        confirmModuleRegistrationsInput:
          $ref: "#/components/schemas/ConfirmModuleRegistrationsInput"
        servicePageInput:
          $ref: "#/components/schemas/ServicePageInput"
        calendarMonthInput:
          $ref: "#/components/schemas/CalendarMonthInput"
        updatePersonalProfileInput:
          $ref: "#/components/schemas/UpdatePersonalProfileInput"
        updateResumeProfileInput:
          $ref: "#/components/schemas/UpdateResumeProfileInput"
        createPortfolioProjectInput:
          $ref: "#/components/schemas/CreatePortfolioProjectInput"
        updatePortfolioProjectInput:
          $ref: "#/components/schemas/UpdatePortfolioProjectInput"
        deletePortfolioProjectInput:
          $ref: "#/components/schemas/DeletePortfolioProjectInput"
        submitFinancePaymentProofInput:
          $ref: "#/components/schemas/SubmitFinancePaymentProofInput"
        deleteFinancePaymentProofInput:
          $ref: "#/components/schemas/DeleteFinancePaymentProofInput"
        sendChatMessageInput:
          $ref: "#/components/schemas/SendChatMessageInput"
        chatTarget:
          $ref: "#/components/schemas/ChatTarget"
        personalAddress:
          $ref: "#/components/schemas/PersonalAddress"
        moduleRegistrationSelectionInput:
          $ref: "#/components/schemas/ModuleRegistrationSelectionInput"


    OnlineFormAttachment:
      type: object
      required: [id, kind, name, mimeType, sizeBytes, sizeLabel]
      description: |
        Online Forms / chat-style message attachment metadata.
        Constraints: sizeBytes <= 26214400 (25 MiB); arrays max 5 items and
        78643200 bytes total. Image kind requires a safe raster MIME type.
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          enum: [image, file]
        name:
          type: string
          minLength: 1
        mimeType:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
          maximum: 26214400
        sizeLabel:
          type: string
          minLength: 1
        src:
          type: string
          description: "Optional blob: preview URL for safe inline images (session-only)"

    ImmigrationCaseStatus:
      type: string
      enum:
        - submitted
        - information-required
        - rejected
        - documents-accepted
        - emgs-processing
        - eval-approved
        - arrival-medical
        - awaiting-passport
        - passport-received
        - endorsement-processing
        - cancellation-processing
        - cancelled
        - ready-for-collection
        - completed

