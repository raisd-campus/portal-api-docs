openapi: 3.1.0
info:
  title: Raisd Portal API
  version: 0.4.6
  summary: Stage-1 HTTP face of the campus Portal API
  description: |
    Bearer-authenticated RPC over the student-portal `PortalApi` surface.

    Portals (applicant, student, lecturer, staff) call this service only.
    They never talk to Postgres or the existing CMS directly.

    **8 October local Student workflows**
    Source-aligned forms, submitModuleRegistrationRequest, getStudentDocumentDelivery,
    acknowledgeStudentDocumentReceipt and migrateLegacyFeedbackDraft are local mock additions.
    Department reviewer commands remain DEV-only. New hosted operations require explicit
    server capability advertisement; unsupported writes never fall back to mock.
    See ai/frontend/student-portal/student-workflows.md for the approved local baseline.

    **12 October local admissions preparation (not deployed)**
    Original-file delivery and accepted applicant-specific Student continuation are
    prepared behind DEMO_ADMISSIONS_RESOURCES, default false. Explicit Demo artifact
    migration is required. One MiB chunks, 25 MiB/file, SHA-256, ownership, five-minute
    session-bound one-time grants and capability-gated delivery do not replace Live storage.
    getPortalRecordGraph is local mock tooling only and is not advertised over HTTP.

    **12 October local paired Community preparation (not deployed)**
    Shared programme/module/DM chat and actual file bytes require DEMO_COMMUNITY_CHAT,
    default false, explicit additive SQL and pre-activation legacy import.
    Schema 4 and old per-student/service stores remain unchanged.
    GET /v1/meta/community advertises version 1 and bounded one MiB chunks.

    **Stage 1 behaviour**
    - Each call runs the student-portal `MockPortalApi` engine over Demo records.
      On the UltaHost k3s Demo (`api.raisd.co`), sessions and records live in
      VPS Postgres (one table per record collection), so edits persist across
      pods; locally without `DATABASE_URL` both stay in memory. `sessions` and
      `data` in `/health` and `/v1/meta` say which. Any `POST /v1/portal/{method}`
      can also return `409` (records changed concurrently and retries ran out) or
      `503` (records database unavailable), both with `ErrorBody`.
      Legacy `*.vercel.app` hosts are redirect-only (Neon Demo project deleted).
    - Mutating calls return `cms.acknowledged: true` with `cms.mode: stub`.
    - CAP-53 will replace the stub with a live CMS adapter.

    **Frontend consumers (today)**
    - `student-portal` is the implemented HTTP UI. It calls every method below
      via React Query hooks except `getPortalRecordGraph` (local mock tests/internals; forbidden over HTTP).
    - `applicant-portal` calls Demo Applicant methods over
      `POST /v1/auth/applicant/login` and `POST /v1/applicant/{method}` when
      `VITE_PORTAL_API_URL` is set; otherwise it keeps the in-process mock.
      Lecturer and Staff expose partial Demo LMS/payment/registration HTTP surfaces;
      their remaining Live department workflows are deferred.
    - Student record contract is schema **4** (admissions-aligned profile fields).
    - HTTP transport (Student): `createHttpPortalApi` → `POST /v1/auth/login` then
      `POST /v1/portal/{method}` with `{ "args": [...] }`.
    - HTTP transport (Applicant): `createHttpApplicantPortalApi` →
      `POST /v1/auth/applicant/login` then `POST /v1/applicant/{method}`.
    - Scenario switches over HTTP use `POST /v1/auth/scenario` on the existing
      bearer session (`createHttpPortalApi` / `getHttpPortalHandle`). Logout uses
      `POST /v1/auth/logout`. Mock in-process sessions still call
      `selectStudentScenario` locally.

    **Typical Student flow**
    1. `POST /v1/auth/login`
    2. `POST /v1/portal/{method}` with `Authorization: Bearer <accessToken>`
    3. Optional `POST /v1/auth/scenario` to switch Demo scenarios without a new login

    **Typical Applicant flow**
    1. `POST /v1/auth/applicant/login`
    2. `POST /v1/applicant/{method}` with `Authorization: Bearer <accessToken>`

    **Blocked over HTTP (404)**
    `dispose`, `selectStudentScenario`, `runDevelopmentAction`, and any
    `_`-prefixed name. Use `POST /v1/auth/scenario` instead of
    `selectStudentScenario`. Staff milestone simulation stays on student-portal
    `/dev/admin-actions` until Live staff PortalApi methods land (see
    `StaffProgressionDeferred`).

    **LMS surface (Demo)** — Materials, assignment metadata, and lecturer
    review are tagged `LMS` in this contract. Catalogue + deferred CAP gaps:
    `GET /v1/meta/lms` (`LmsSurfaceCatalogue`). Not a Live LMS (BASE-44).

    **PortalApi methods (55)** — each appears as its own `POST /v1/portal/<method>` operation in Swagger UI.\n\n    **PortalApi method catalog (55 methods from student-portal)**

    | Method | Args (`args` array) | Returns | Area | Frontend |
    |--------|---------------------|---------|------|----------|
    | `getImmigration` | `optional ProgrammeEnrolmentReadInput` | `ImmigrationResponse` | immigration | Immigration page |
    | `getOnlineForms` | `optional ProgrammeEnrolmentReadInput` | `OnlineFormsResponse` | online-forms | Online forms list + nav badge |
    | `getOnlineForm` | `OnlineFormInput (+ enrolment)` | `OnlineFormContext or null` | online-forms | Form entry |
    | `getOnlineFormSubmission` | `OnlineFormSubmissionInput (+ enrolment)` | `OnlineFormSubmissionResponse` | online-forms | Submission view |
    | `startOnlineForm` | `OnlineFormInput` | `OnlineFormSubmissionResponse` | online-forms | Start form |
    | `saveOnlineFormDraft` | `SaveOnlineFormDraftInput` | `OnlineFormSubmissionResponse` | online-forms | Autosave draft |
    | `submitOnlineForm` | `SubmitOnlineFormInput` | `OnlineFormSubmissionResponse` | online-forms | Submit |
    | `withdrawOnlineForm` | `OnlineFormSubmissionInput` | `OnlineFormSubmissionResponse` | online-forms | Withdraw |
    | `sendOnlineFormMessage` | `SendOnlineFormMessageInput` | `OnlineFormSubmissionResponse` | online-forms | Case message |
    | `markOnlineFormRead` | `MarkOnlineFormReadInput` | `OnlineFormSubmissionResponse` | online-forms | Mark read |
    | `getAnnouncements` | `optional ProgrammeEnrolmentReadInput` | `AnnouncementsResponse` | announcements | Announcements list |
    | `getAnnouncement` | `AnnouncementInput (+ enrolment)` | `AnnouncementResponse` | announcements | Announcement detail |
    | `getUniversityPolicies` | `optional ProgrammeEnrolmentReadInput` | `UniversityPoliciesResponse` | policies | University policies |
    | `getLecturerReview` | `LecturerReviewInput (+ enrolment)` | `LecturerReviewResponse` | lecturer-review | Lecturer review form |
    | `submitLecturerReview` | `SubmitLecturerReviewInput` | `LecturerReviewResponse` | lecturer-review | Submit review |
    | `getDashboard` | `optional ProgrammeEnrolmentReadInput` | `DashboardResponse` | dashboard | Home dashboard |
    | `getAcademicPerformance` | `optional ProgrammeEnrolmentReadInput` | `AcademicPerformanceResponse` | academic | Performance |
    | `getAcademicModules` | `optional ProgrammeEnrolmentReadInput` | `AcademicModulesResponse` | academic | Modules list |
    | `getAcademicTimetable` | `AcademicTimetableInput (+ enrolment)` | `AcademicTimetableResponse` | academic | Timetable + attendance |
    | `getAcademicGraduation` | `optional ProgrammeEnrolmentReadInput` | `AcademicGraduationResponse` | academic | Graduation |
    | `getAcademicStudyPlan` | `optional ProgrammeEnrolmentReadInput` | `AcademicStudyPlanResponse` | academic | Study plan |
    | `getAcademicModuleRegistration` | `optional ProgrammeEnrolmentReadInput` | `AcademicModuleRegistrationResponse` | registration | Module registration |
    | `getModuleRegistrationFeePreview` | `ModuleRegistrationFeePreviewInput` | `ModuleRegistrationFeePreviewResponse` | registration | Fee preview |
    | `confirmModuleRegistrations` | `ConfirmModuleRegistrationsInput` | `AcademicModuleRegistrationResponse` | registration | Confirm registration |
    | `getAcademicContext` | `optional ProgrammeEnrolmentReadInput` | `AcademicContextResponse` | academic | App shell / profile context |
    | `getAcademicModuleDetail` | `AcademicModuleDetailInput (+ enrolment)` | `AcademicModuleDetailResponse` | academic | Module detail |
    | `getAcademicModuleAttendance` | `AcademicModuleDetailInput (+ enrolment)` | `AcademicModuleAttendanceResponse` | academic | Module attendance |
    | `getAcademicModuleMaterials` | `AcademicModuleDetailInput (+ enrolment)` | `AcademicModuleMaterialsResponse` | materials | Materials list |
    | `getAcademicModuleMaterialDetail` | `AcademicModuleMaterialDetailInput (+ enrolment)` | `AcademicModuleMaterialDetailResponse` | materials | Material detail |
    | `submitAssignment` | `SubmitAssignmentInput (file)` | `AcademicModuleMaterialsResponse` | materials | Submit assignment |
    | `deleteAssignmentSubmission` | `DeleteAssignmentSubmissionInput` | `AcademicModuleMaterialsResponse` | materials | Delete submission |
    | `getPersonalProfile` | `optional ProgrammeEnrolmentReadInput` | `PersonalProfileResponse` | profile | Personal profile |
    | `updatePersonalProfile` | `UpdatePersonalProfileInput` | `PersonalProfileResponse` | profile | Update personal |
    | `getAcademicProfile` | `optional ProgrammeEnrolmentReadInput` | `AcademicProfileResponse` | profile | Academic profile |
    | `getDocumentsProfile` | `optional ProgrammeEnrolmentReadInput` | `DocumentsProfileResponse` | profile | Documents |
    | `getPrivacySecurity` | `optional ProgrammeEnrolmentReadInput` | `PrivacySecurityResponse` | profile | Privacy & security |
    | `getServices` | `optional ProgrammeEnrolmentReadInput` | `ServicesResponse` | services | Services list / sidebar |
    | `getServicePage` | `ServicePageInput (+ enrolment)` | `ServicePageResponse` | services | Service page |
    | `getResumeProfile` | `optional ProgrammeEnrolmentReadInput` | `ResumeProfileResponse` | profile | Resume |
    | `updateResumeProfile` | `UpdateResumeProfileInput` | `ResumeProfileResponse` | profile | Update resume |
    | `getPortfolioProfile` | `optional ProgrammeEnrolmentReadInput` | `PortfolioProfileResponse` | profile | Portfolio |
    | `createPortfolioProject` | `CreatePortfolioProjectInput (artwork file)` | `PortfolioProject` | profile | Create project |
    | `updatePortfolioProject` | `UpdatePortfolioProjectInput` | `PortfolioProject` | profile | Update project |
    | `deletePortfolioProject` | `DeletePortfolioProjectInput` | `void` | profile | Delete project |
    | `getCommunity` | `optional ProgrammeEnrolmentReadInput` | `CommunityResponse` | community | Community directory |
    | `getCalendarMonth` | `CalendarMonthInput (+ enrolment)` | `CalendarMonthResponse` | calendar | Calendar panel |
    | `getFinanceStatement` | `optional ProgrammeEnrolmentReadInput` | `FinanceStatementResponse` | finance | Finance statement |
    | `submitFinancePaymentProof` | `SubmitFinancePaymentProofInput (file)` | `FinanceStatementResponse` | finance | Upload proof |
    | `deleteFinancePaymentProof` | `DeleteFinancePaymentProofInput` | `FinanceStatementResponse` | finance | Delete proof |
    | `getPortalRecordGraph` | `(none)` | `PortalRecordGraph` | internal | Tests / internals only |
    | `getChatConversations` | `optional ProgrammeEnrolmentReadInput` | `ConversationListResponse` | chat | Chat list |
    | `getChatConversation` | `conversationId, optional ProgrammeEnrolmentReadInput` | `ConversationDetailResponse` | chat | Chat thread |
    | `markChatConversationRead` | `conversationId, optional ProgrammeEnrolmentReadInput` | `ConversationSummary` | chat | Mark read |
    | `sendChatMessage` | `SendChatMessageInput` | `ChatMutationResult` | chat | Send message |
    | `deleteChatMessage` | `conversationId, messageId, optional ProgrammeEnrolmentReadInput` | `ChatMutationResult` | chat | Delete message |

    Shared optional scope on many reads:
    `{ "programmeEnrolmentId": "<id>" | null }` (`ProgrammeEnrolmentReadInput`).

    File arguments use `PortalFile` (`__portalFile: true`, `name`, `type`, `size`,
    optional `contentBase64`) instead of a browser `File`.

