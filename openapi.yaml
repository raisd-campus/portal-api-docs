        country:
          type: string
        state:
          type: string
        city:
          type: string
        postcode:
          type: string

    UpdatePersonalProfileInput:
      type: object
      properties:
        fatherGuardian:
          anyOf:
          - type: object
            properties:
              fullName:
                type: string
                minLength: 1
              contactNumber:
                type: string
                minLength: 7
              emailAddress:
                type: string
                format: email
                pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            required:
            - fullName
            - contactNumber
            - emailAddress
          - type: 'null'
        motherGuardian:
          anyOf:
          - type: object
            properties:
              fullName:
                type: string
                minLength: 1
              contactNumber:
                type: string
                minLength: 7
              emailAddress:
                type: string
                format: email
                pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            required:
            - fullName
            - contactNumber
            - emailAddress
          - type: 'null'
        disabilityAnswer:
          anyOf:
          - type: string
            enum:
            - 'yes'
            - 'no'
          - type: 'null'
        disabilityDetails:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        contactNumber:
          type: string
          minLength: 7
        maritalStatus:
          type: string
          enum:
          - single
          - married
          - divorced
          - widowed
        emailAddress:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        permanentAddress:
          type: object
          properties:
            addressLine:
              type: string
              minLength: 1
            country:
              type: string
              minLength: 1
            state:
              type: string
              minLength: 1
            city:
              type: string
              minLength: 1
            postcode:
              type: string
              minLength: 1
          required:
          - addressLine
          - country
          - state
          - city
          - postcode
        currentAddress:
          type: object
          properties:
            addressLine:
              type: string
              minLength: 1
            country:
              type: string
              minLength: 1
            state:
              type: string
              minLength: 1
            city:
              type: string
              minLength: 1
            postcode:
              type: string
              minLength: 1
          required:
          - addressLine
          - country
          - state
          - city
          - postcode
        emergencyContacts:
          minItems: 1
          type: array
          items:
            type: object
            properties:
              relationship:
                default: null
                anyOf:
                - type: string
                  minLength: 1
                - type: 'null'
              id:
                anyOf:
                - type: string
                  minLength: 1
                - type: 'null'
              fullName:
                type: string
                minLength: 1
              contactNumber:
                type: string
                minLength: 7
              emailAddress:
                type: string
                format: email
                pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            required:
            - id
            - fullName
            - contactNumber
            - emailAddress
      required:
      - contactNumber
      - maritalStatus
      - emailAddress
      - permanentAddress
      - currentAddress
      - emergencyContacts
      additionalProperties: false
      description: Actual editable Student profile payload. Legacy requests may omit new guardian/disability
        fields; omission preserves canonical values. Explicit null clears an optional value. Disability details
        are required when answered yes. Official identity and religion are locked. Hosted support requires
        the schema-v4 engine upgrade.
