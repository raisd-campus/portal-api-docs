      description: |
        `args`: `[conversationId, ProgrammeEnrolmentReadInput?]`.
        Result is wrapped with stub CMS acknowledgement.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalCallRequest"
            example:
              args:
                - conv-1
                - {}
      responses:
        "200":
          description: Method succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalCallResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or blocked method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /v1/portal/markChatConversationRead:
    post:
      tags: [Chat]
      operationId: portal_markChatConversationRead
