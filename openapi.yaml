servers:
  - url: https://api.raisd.co
    description: UltaHost k3s Demo (VPS Postgres; stub CMS). Per-campus aliases api.{slug}.raisd.co share this service.
  - url: https://api.lesotho.raisd.co
    description: Lesotho campus alias (same portal-api)
  - url: https://raisd-portal-api.vercel.app
    description: Legacy Vercel alias — permanent redirect to api.raisd.co
  - url: http://127.0.0.1:8080
    description: Local portal-api (`npm start` in the raisd-campus/portal-api checkout)

tags:
  - name: Health
    description: Liveness, metadata, and published docs
  - name: Meta
    description: Catalogues for deferred or domain-scoped PortalApi surfaces
  - name: Auth
    description: Demo student and applicant sessions
  - name: Applicant
    description: Demo ApplicantPortalApi RPC (`POST /v1/applicant/{method}`)
  - name: LMS
    description: |
      Student learning surface on Portal API (Materials, assignments, lecturer review).
      Demo only — Materials alone is not a complete LMS (BASE-44). Proposed quiz /
      live-class / forum methods are listed at `GET /v1/meta/lms` as deferred.
  - name: Immigration
    description: PortalApi · Immigration
  - name: Online forms
    description: PortalApi · Online forms
  - name: Announcements
    description: PortalApi · Announcements
  - name: Policies
    description: PortalApi · Policies
  - name: Lecturer review
    description: PortalApi · Lecturer review (also under LMS)
  - name: Dashboard
    description: PortalApi · Dashboard
  - name: Academic
    description: PortalApi · Academic
  - name: Registration
    description: PortalApi · Registration
  - name: Materials
    description: PortalApi · Materials (also under LMS)
  - name: Profile
