x-applicant-operations:
  implementation: Demo ApplicantPortalApi over HTTP (Postgres-backed session store) plus in-process mock in the applicant-portal when VITE_PORTAL_API_URL is unset
  httpEndpoints:
    - POST /v1/auth/applicant/login
    - POST /v1/applicant/{method}
  methods:
    - getStudyCatalogue
    - getApplications
    - getApplication
    - saveApplicationDraft
    - submitApplication
    - getConversation
    - sendApplicationMessage
    - markApplicationRead
    - confirmApplicationEligibility
    - acceptApplicationEnrolment
  documentation: ai/frontend/applicant-portal/mock-api.md
  handoff: ai/backend/admissions-handoff.md

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                ok: true
                service: portal-api
                mode: stub-session
                sessions: postgres
                data: postgres
                cms: stub
                time: "2026-09-21T09:25:12.975Z"

  /openapi.yaml:
    get:
      tags: [Health]
      operationId: getOpenApiDocument
      summary: OpenAPI document
      description: Returns this OpenAPI YAML from the control-plane repository root, or redirects to the GitHub Pages copy when the spec is not packaged (Vercel Demo).
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 YAML
          content:
            application/yaml:
              schema:
                type: string
        "302":
          description: Redirect to https://raisd-campus.github.io/portal-api-docs/openapi.yaml

  /docs:
    get:
      tags: [Health]
      operationId: getSwaggerUi
      summary: Swagger UI
      description: Interactive explorer for this API (same UI as GitHub Pages). Redirects to GitHub Pages when the HTML is not packaged (Vercel Demo).
      security: []
      responses:
        "200":
          description: HTML Swagger UI
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Redirect to https://raisd-campus.github.io/portal-api-docs/openapi.html

  /v1/meta:
    get:
      tags: [Health]
      operationId: getMeta
      summary: Service metadata and supported scenarios
      security: []
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
              example:
                service: portal-api
                version: 0.1.0
                schemaVersion: 4
                scenarios:
                  - mid-programme
                  - first-semester-registration
                  - new-student-pass
                  - graduation-ready
                applicantScenarios:
                  - fresh
                  - completed
                  - approved
                defaultScenarioId: first-semester-registration
                defaultApplicantScenarioId: fresh
                cmsMode: stub
                sessions: postgres
                applicantSessions: postgres
                data: postgres
                applicantData: postgres
                docs: /docs
                openapi: /openapi.yaml
                lms: /v1/meta/lms
                applicant: /v1/applicant/:method
                note: "Demo records live in Postgres (one table per record collection, including Schema v4 campus policy and admissions-aligned profile fields) and run through the Student MockPortalApi engine until CAP-53 connects the existing CMS. Applicant Demo methods are at POST /v1/applicant/:method. LMS surface catalogue: GET /v1/meta/lms."


  /v1/meta/staff-progression:
    get:
      tags: [Meta]
      operationId: staffProgressionDeferred
      summary: Describe deferred Live staff progression contracts
      description: |
        Documents reserved staff PortalApi method names for Immigration,
        Graduation, Online Forms review, and Finance proof verification.
        These are not callable in Stage 1. Demo staff advances use
        student-portal Admin Actions (`runDevelopmentAction`, HTTP-blocked).
      security: []
      responses:
        "200":
          description: Deferred staff contract catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProgressionDeferred"
              example:
                status: deferred
                reservedMethods:
                  - reviewOnlineForm
                  - advanceImmigrationCase
                  - verifyFinancePaymentProof
                  - postFinanceCounterPayment
                  - recordGraduationDepartmentDecision
                  - approveGraduationClearance
                  - advanceGraduationDocument
                  - advanceGraduationStudentPass
                note: Staff progression is Admin Actions only until Live staff PortalApi exists.


  /v1/meta/lms:
    get:
      tags: [Meta, LMS]
      operationId: lmsSurfaceCatalogue
      summary: Catalogue the Demo LMS PortalApi surface and deferred CAP gaps
      description: |
        Lists callable student LMS methods (Materials, assignment metadata,
        lecturer review), the Neon Demo collections they touch, CAP IDs, and
        deferred quiz / live-class / forum / feedback method names for M5.
        Does **not** claim a Live LMS product (BASE-44). Assignment file bytes
        remain metadata-only until the evidence store (SDD-10 Q5 / phase 7.3).
      security: []
      responses:
        "200":
          description: LMS surface catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LmsSurfaceCatalogue"
              example:
                status: demo
                note: Student LMS role surface on Portal API. Materials alone is not a complete LMS (BASE-44). Not Live.
                methods:
                  - method: getAcademicModuleMaterials
                    caps: [CAP-17, CAP-18, CAP-19, CAP-23, CAP-27]
                    tables: [module_weeks, module_learning_items, learning_progress, module_assessments, assignment_submissions]
                    domain: lms
                    demoStatus: Partial
                  - method: submitAssignment
                    caps: [CAP-20]
                    tables: [assignment_submissions]
                    domain: lms
                    demoStatus: Demo
                deferredMethods:
                  - method: startQuizAttempt
                    caps: [CAP-24, CAP-29]
                    tables: [quiz_attempts, quiz_questions, quiz_attempt_answers]
                    milestone: M5
                    status: not-started
                collections:
                  lms: [module_weeks, module_learning_items, learning_progress, assignment_submissions, lecturer_reviews]
                  shared: [module_offerings, teaching_assignments, class_schedules, class_sessions, attendances, module_assessments, assessment_results, academic_terms, module_registrations]
                  proposed: [quiz_attempts, quiz_questions, quiz_attempt_answers, assessment_feedback, live_class_sessions, live_class_attendances, module_forums, module_forum_posts, learning_release_rules, material_qa_reviews, copyright_permissions]


  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Create a demo student session
      description: |
        Issues a bearer token bound to a student scenario after checking the
        demo student's password. Stage-1 demo auth only, not campus identity.
        Returns 503 when the server has no demo credentials configured.
        Used by `createHttpPortalApi` in student-portal.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              default:
                value:
                  password: "<demo password>"
              midProgramme:
                value:
                  scenarioId: mid-programme
                  password: "<demo password>"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Password does not match the demo student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: Student and password do not match.
        "503":
          description: Demo student credentials are not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session
      description: Ends the bearer session. `createHttpPortalApi` calls this when the HTTP handle is disposed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session destroyed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/scenario:
    post:
      tags: [Auth]
      operationId: switchScenario
      summary: Switch the demo student scenario on the current session
      description: |
        Preferred remote alternative to MockPortalApi.selectStudentScenario
        (which is blocked over HTTP). The student-portal HTTP client calls this
        endpoint via `getHttpPortalHandle().switchScenario` when switching Demo
        scenarios.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenarioId]
              properties:
                scenarioId:
                  $ref: "#/components/schemas/ScenarioId"
      responses:
        "200":
          description: Scenario switched
          content:
            application/json:
              schema:
                type: object
                required: [scenarioId, studentProfileId]
                properties:
                  scenarioId:
                    $ref: "#/components/schemas/ScenarioId"
                  studentProfileId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/applicant/login:
    post:
      tags: [Auth]
      operationId: applicantLogin
      summary: Create a demo applicant session
      description: |
        Issues a bearer token bound to an applicant Demo scenario (`fresh`,
        `completed`, or `approved`) after checking the demo applicant password.
        Seeds Postgres-backed applicant records on first login. Used by
        `createHttpApplicantPortalApi` in applicant-portal.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                scenarioId:
                  type: string
                  enum: [fresh, completed, approved]
                  default: fresh
                password:
                  type: string
                  minLength: 1
            example:
              scenarioId: fresh
              password: "<demo password>"
      responses:
        "200":
          description: Applicant session created
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType, expiresIn, scenarioId, applicantId, personId]
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    const: Bearer
                  expiresIn:
                    type: integer
                  scenarioId:
                    type: string
                    enum: [fresh, completed, approved]
                  applicantId:
                    type: string
                  personId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Password does not match the demo applicant scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Demo applicant credentials are not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /v1/applicant/{method}:
    post:
      tags: [Applicant]
      operationId: callApplicantMethod
      summary: Call an ApplicantPortalApi method
      description: |
        Demo RPC for the ten ApplicantPortalApi methods. Body is
        `{ "args": [...] }`. Development reviewer actions are not exposed.
      security:
        - bearerAuth: []
      parameters:
        - name: method
          in: path
          required: true
          schema:
            type: string
            enum:
              - getStudyCatalogue
              - getApplications
              - getApplication
              - saveApplicationDraft
              - submitApplication
              - getConversation
              - sendApplicationMessage
              - markApplicationRead
              - confirmApplicationEligibility
              - acceptApplicationEnrolment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                args:
                  type: array
                  items: {}
              example:
                args: []
      responses:
        "200":
          description: Method result with stub CMS acknowledgement
          content:
            application/json:
              schema:
                type: object
                required: [result, cms]
                properties:
                  result: {}
                  cms:
                    type: object
                    required: [acknowledged, mode]
                    properties:
                      acknowledged:
                        type: boolean
                      mode:
                        type: string
                        const: stub
                      note:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown applicant method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Applicant records temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  # --- PortalApi methods (one operation per student-portal method) ---
  /v1/portal/getImmigration:
    post:
      tags: [Immigration]
      operationId: portal_getImmigration
      summary: Get student pass / immigration case
      description: |
        Optional enrolment scope. `args`: `[]` or `[ProgrammeEnrolmentReadInput]`.
        Result is wrapped with stub CMS acknowledgement.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalCallRequest"
            example:
              args:
                - programmeEnrolmentId: null
      responses:
        "200":
          description: Method succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalCallResponseImmigration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or blocked method
          content:
            application/json:
