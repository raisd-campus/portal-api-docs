  /v1/meta/materials:
    get:
      tags:
      - Meta
      - Materials
      operationId: reusableMaterialsCapability
      summary: Advertise read-only shared memory Materials
      security: []
      responses:
        '200':
          description: Capability metadata; disabled is never permission to silently
            fall back
          content:
            application/json:
              schema:
                type: object
                required:
                - enabled
                - version
                - chunkBytes
                - persistence
                - lecturerReadOnly
                - releasePolicy
                properties:
                  enabled:
                    type: boolean
                  version:
                    type: integer
                    const: 1
                  chunkBytes:
                    type: integer
                    const: 1048576
                  persistence:
                    type: string
                    const: memory
                  lecturerReadOnly:
                    type: boolean
                    const: true
                  releasePolicy:
                    type: string
                    const: teaching-week-start
  /v1/materials/{method}:
    post:
      tags:
      - LMS
      - Materials
      operationId: reusableMaterialsOperation
      summary: Read assigned Materials or original file chunks
      description: 'Memory Demo only. Lecturer Materials is read-only: draft, publication,
        upload and deletion attempts return 403, including legacy publication. Reads
        exclude private drafts and unpublished plan content. Availability uses configured
        teaching-week starts at campus-local midnight. Lecturer can inspect scheduled
        assigned content; Student file chunks require exact registration/campus and
        server-time release. Canonical PDF attachment samples have clearly labelled
        DEMO filenames, actual byte sizes and SHA-256 descriptors backed by bundled
        sample bytes rehydrated after memory API restarts; user uploads still reset.
        No admin write API is available.'
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: method
        required: true
        schema:
          type: string
          enum:
          - getMaterials
          - fileChunk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/MaterialsReadInput'
              - $ref: '#/components/schemas/MaterialsFileRead'
      responses:
        '200':
          description: Resolved read-only bundle or verified original file chunk
          content:
            application/json:
              schema:
                type: object
                required:
                - result
                properties:
                  result:
                    oneOf:
                    - $ref: '#/components/schemas/ReusableMaterialsBundle'
                    - $ref: '#/components/schemas/MaterialFileChunk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden Lecturer write/private draft/plan access, unassigned
            class or unreleased Student download
        '404':
          description: Capability, method, class or original file unavailable
        '409':
          description: Class setup or stale content conflict
        '413':
          description: Request or memory file capacity exceeded
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                ok: true
                service: portal-api
                mode: stub-session
                sessions: postgres
                data: postgres
                cms: stub
                time: "2026-09-21T09:25:12.975Z"

  /openapi.yaml:
    get:
      tags: [Health]
      operationId: getOpenApiDocument
      summary: OpenAPI document
      description: Returns this OpenAPI YAML from the control-plane repository root, or redirects to the GitHub Pages copy when the spec is not packaged (Vercel Demo).
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 YAML
          content:
            application/yaml:
              schema:
                type: string
        "302":
          description: Redirect to https://docs.raisd.co/openapi.yaml

  /docs:
    get:
      tags: [Health]
      operationId: getSwaggerUi
      summary: Swagger UI
      description: Interactive explorer for this API (same UI as GitHub Pages). Redirects to GitHub Pages when the HTML is not packaged (Vercel Demo).
      security: []
      responses:
        "200":
          description: HTML Swagger UI
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Redirect to https://docs.raisd.co/openapi.html

  /v1/meta:
    get:
      tags: [Health]
      operationId: getMeta
      summary: Service metadata and supported scenarios
      security: []
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
              example:
                service: portal-api
                version: 0.1.0
                schemaVersion: 4
                scenarios:
                  - mid-programme
                  - first-semester-registration
                  - new-student-pass
                  - graduation-ready
                applicantScenarios:
                  - fresh
                  - completed
                  - approved
                defaultScenarioId: first-semester-registration
                defaultApplicantScenarioId: fresh
                cmsMode: stub
                sessions: postgres
                applicantSessions: postgres
                data: postgres
                applicantData: postgres
                docs: /docs
                openapi: /openapi.yaml
                lms: /v1/meta/lms
                applicant: /v1/applicant/:method
                note: "Demo records live in Postgres (one table per record collection, including Schema v4 campus policy and admissions-aligned profile fields) and run through the Student MockPortalApi engine until CAP-53 connects the existing CMS. Applicant Demo methods are at POST /v1/applicant/:method. LMS surface catalogue: GET /v1/meta/lms."


  /v1/meta/staff-progression:
    get:
      tags: [Meta]
      operationId: staffProgressionDeferred
      summary: Describe deferred Live staff progression contracts
      description: |
        Documents reserved staff PortalApi method names for Immigration,
        Graduation, Online Forms review, and Finance proof verification.
        These are not callable in Stage 1. Demo staff advances use
        student-portal Admin Actions (`runDevelopmentAction`, HTTP-blocked).
      security: []
      responses:
        "200":
          description: Deferred staff contract catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProgressionDeferred"
              example:
                status: deferred
                reservedMethods:
                  - reviewOnlineForm
                  - advanceImmigrationCase
                  - verifyFinancePaymentProof
                  - postFinanceCounterPayment
                  - recordGraduationDepartmentDecision
                  - approveGraduationClearance
                  - advanceGraduationDocument
                  - advanceGraduationStudentPass
                note: Staff progression is Admin Actions only until Live staff PortalApi exists.


  /v1/meta/lms:
    get:
      tags: [Meta, LMS]
      operationId: lmsSurfaceCatalogue
      summary: Catalogue the Demo LMS PortalApi surface and deferred CAP gaps
      description: |
        Lists callable student LMS methods (Materials, assignment metadata,
        lecturer review), the Demo Postgres collections they touch, CAP IDs, and
        deferred quiz / live-class / forum / feedback method names for M5.
        Does **not** claim a Live LMS product (BASE-44). Assignment file bytes
        remain metadata-only until the evidence store (SDD-10 Q5 / phase 7.3).
      security: []
      responses:
        "200":
          description: LMS surface catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LmsSurfaceCatalogue"
              example:
                status: demo
                note: Student LMS role surface on Portal API. Materials alone is not a complete LMS (BASE-44). Not Live.
                methods:
                  - method: getAcademicModuleMaterials
                    caps: [CAP-17, CAP-18, CAP-19, CAP-23, CAP-27]
                    tables: [module_weeks, module_learning_items, learning_progress, module_assessments, assignment_submissions]
                    domain: lms
                    demoStatus: Partial
                  - method: submitAssignment
                    caps: [CAP-20]
                    tables: [assignment_submissions]
                    domain: lms
                    demoStatus: Demo
                deferredMethods:
                  - method: startQuizAttempt
                    caps: [CAP-24, CAP-29]
                    tables: [quiz_attempts, quiz_questions, quiz_attempt_answers]
                    milestone: M5
                    status: not-started
                collections:
                  lms: [module_weeks, module_learning_items, learning_progress, assignment_submissions, lecturer_reviews]
                  shared: [module_offerings, teaching_assignments, class_schedules, class_sessions, attendances, module_assessments, assessment_results, academic_terms, module_registrations]
                  proposed: [quiz_attempts, quiz_questions, quiz_attempt_answers, assessment_feedback, live_class_sessions, live_class_attendances, module_forums, module_forum_posts, learning_release_rules, material_qa_reviews, copyright_permissions]


  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Create a demo student session
      description: |
        Issues a bearer token bound to a student scenario after checking the
        demo student's password. Stage-1 demo auth only, not campus identity.
        Returns 503 when the server has no demo credentials configured.
        Used by `createHttpPortalApi` in student-portal.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              default:
                value:
                  password: "<demo password>"
              midProgramme:
                value:
                  scenarioId: mid-programme
                  password: "<demo password>"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Password does not match the demo student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: Student and password do not match.
        "503":
          description: Demo student credentials are not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /v1/auth/sso/exchange:
    post:
      tags: [Auth]
      operationId: exchangeSsoAccessToken
      summary: Exchange a Raisd SSO access token for a Portal API session
      description: |
        Introspects the bearer access token against Raisd SSO (`SSO_BASE_URL`,
        default `https://sso.raisd.co`) and issues a normal Portal API session
        for the active SSO role (`student` / `applicant` / `staff` / `lecturer`).
        Demo exchange requires an explicit known email/account or supported staff desk;
        unknown identities return 403 rather than another person's scenario. Lecturer
        sessions include the linked staffMemberId and academicTitle.
        Stub scenario password logins remain available when `CMS_MODE=stub`.
        See `docs/ai/backend/sso.md`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessToken]
              properties:
                accessToken:
                  type: string
                  description: Opaque SSO access token from `POST https://sso.raisd.co/v1/oauth/token`
            example:
              accessToken: "<sso access token>"
      responses:
        "200":
          description: Portal API session created for the SSO active role
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType, expiresIn, portal]
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    const: Bearer
                  expiresIn:
                    type: integer
                  portal:
                    type: string
                    enum: [student, applicant, staff, lecturer, admin]
                  scenarioId:
                    type: string
                  supportedMethods:
                    type: array
                    items:
                      type: string
                  role:
                    type: string
                  displayName:
                    type: string
                  username:
                    type: string
                  staffMemberId:
                    type: string
                    description: Linked Lecturer actor ID; present for lecturer sessions
                  academicTitle:
                    type: string
                    description: Recorded Lecturer title; may be empty
                  sso:
                    type: object
                    additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: SSO token inactive or missing role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Active identity has no linked Demo account, supported staff desk, or enabled account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: SSO introspect unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session
      description: Ends the bearer session. `createHttpPortalApi` calls this when the HTTP handle is disposed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session destroyed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/scenario:
    post:
      tags: [Auth]
      operationId: switchScenario
      summary: Switch the demo student scenario on the current session
      description: |
        Preferred remote alternative to MockPortalApi.selectStudentScenario
        (which is blocked over HTTP). The student-portal HTTP client calls this
        endpoint via `getHttpPortalHandle().switchScenario` when switching Demo
        scenarios.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenarioId]
              properties:
                scenarioId:
                  $ref: "#/components/schemas/ScenarioId"
      responses:
        "200":
          description: Scenario switched
          content:
            application/json:
              schema:
                type: object
                required: [scenarioId, studentProfileId]
                properties:
                  scenarioId:
                    $ref: "#/components/schemas/ScenarioId"
                  studentProfileId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/applicant/login:
    post:
      tags: [Auth]
      operationId: applicantLogin
      summary: Create a demo applicant session
      description: |
        Issues a bearer token bound to an applicant Demo scenario (`fresh`,
        `completed`, or `approved`) after checking the demo applicant password.
        Seeds Postgres-backed applicant records on first login. Used by
        `createHttpApplicantPortalApi` in applicant-portal.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                scenarioId:
                  type: string
                  enum: [fresh, completed, approved]
                  default: fresh
                password:
                  type: string
                  minLength: 1
            example:
              scenarioId: fresh
              password: "<demo password>"
      responses:
        "200":
          description: Applicant session created
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType, expiresIn, scenarioId, applicantId, personId]
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    const: Bearer
                  expiresIn:
                    type: integer
                  scenarioId:
                    type: string
                    enum: [fresh, completed, approved]
                  applicantId:
                    type: string
                  personId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Password does not match the demo applicant scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Demo applicant credentials are not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /v1/applicant/evidence/{operation}:
    post:
      tags: [Applicant]
      operationId: demoApplicantEvidence
      summary: Upload or read an owned Demo original file
      description: |
        Prepared locally, not deployed. Requires DEMO_ADMISSIONS_RESOURCES and an
        explicit Demo artifact migration. One MiB chunks, maximum 25 MiB per file,
        immutable metadata, SHA-256 finalization and authenticated ownership.
        Incomplete resources remain unavailable; abandoned sessions expire after
        24 hours without deleting referenced drafts/submissions. Message purpose
        preserves existing case attachment formats; it does not bypass admissions rules.
      security:
        - bearerAuth: []
      parameters:
        - name: operation
          in: path
          required: true
          schema:
            type: string
            enum: [begin, chunk, finish, read, cleanup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DemoEvidenceUpload'
                - $ref: '#/components/schemas/DemoEvidenceChunk'
                - $ref: '#/components/schemas/DemoEvidenceRead'
      responses:
        '200':
          description: Initiated, chunk acknowledged, finalized, owned chunk, unavailable, or cleanup status
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    oneOf:
                      - $ref: '#/components/schemas/DemoEvidenceResource'
                      - type: object
                        additionalProperties: true
                      - type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Capability disabled or unknown operation
  /v1/portal/getStudentDocumentDelivery:
    post:
      tags: [Profile]
      operationId: demoStudentDocumentDelivery
      summary: Resolve an owned Student document for native viewing or original download
      description: |
        Prepared locally and capability-gated. RPC args contain documentId and optional
        programmeEnrolmentId. Admissions originals return a resource descriptor for bounded
        reads; generated Demo PDFs retain the existing available response. Missing originals
        return unavailable without synthetic replacement. No profile record contains original bytes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [args]
              properties:
                args:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: object
                    required: [documentId]
                    properties:
                      documentId: {type: string}
                      programmeEnrolmentId: {type: [string, 'null']}
      responses:
        '200':
          description: Owned resource descriptor, generated document or honest unavailable state
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    oneOf:
                      - $ref: '#/components/schemas/DemoDocumentResource'
                      - type: object
                        required: [status, documentId, fileName, mimeType, contentBase64]
                        properties:
                          status: {type: string, const: available}
                          documentId: {type: string}
                          fileName: {type: string}
                          mimeType: {type: string}
                          contentBase64: {type: string, maxLength: 34952536}
                      - type: object
                        required: [status, documentId, reason]
                        properties:
                          status: {type: string, const: unavailable}
                          documentId: {type: string}
                          reason: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Server does not advertise this capability
        '503':
          description: Records temporarily unavailable

  /v1/student/evidence/read:
    post:
      tags: [Profile]
      operationId: demoStudentEvidenceRead
      summary: Read original evidence through the accepted admissions relationship
      description: Prepared locally; active authenticated Student and exact owned evidence required. Payment and case attachments are excluded.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoEvidenceRead'
      responses:
        '200':
          description: One verified metadata/chunk result or an explicit unavailable result
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: '#/components/schemas/DemoEvidenceResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Capability disabled
  /v1/applicant/continuation:
    post:
      tags: [Applicant]
      operationId: demoAcceptedStudentContinuation
      summary: Issue a five-minute one-time Student continuation grant
      description: Prepared locally. Requires accepted ownership, expected revision, configured Student origin and an active originating Applicant session. Never send this grant in a URL.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
