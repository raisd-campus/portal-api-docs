        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Capability disabled
  /v1/auth/admissions/claim:
    post:
      tags: [Auth]
      operationId: demoClaimAcceptedStudentContinuation
      summary: Exchange the browser-delivered grant for the correct Student session
      description: Prepared locally. Exact request origin, nonce, active source session, expiry and replay are checked. Repeat fresh grants reuse the same owned account/enrolment; this is Demo provisioning, not Live CMS integration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grant, nonce]
              properties:
                grant: {type: string, minLength: 32, maxLength: 128}
                nonce: {type: string, pattern: '^[a-f0-9]{32}$'}
      responses:
        '200':
          description: Correct accepted Student session
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accessToken, supportedMethods, studentProfileId, programmeEnrolmentId]
                properties:
                  accessToken: {type: string, minLength: 32, maxLength: 128}
                  supportedMethods: {type: array, maxItems: 200, items: {type: string}}
                  studentProfileId: {type: string}
                  programmeEnrolmentId: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Capability disabled

