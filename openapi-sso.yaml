openapi: 3.1.0
info:
  title: Raisd SSO API
  version: 0.1.0
  summary: Campus identity, pluggable login channels, and RBAC
  description: |
    Demo SSO service at `https://sso.raisd.co`. Owns identity and RBAC.
    Portal API validates access tokens via `/v1/introspect`.
    Control roles add flows.configure for University Flows; publishing settings never grants access.
    IO/SSD desks require explicit assignment; persisted identities, passkeys and other grants are preserved.
    Channel `password` (email + password + forgot-password) is enabled in Demo.
    `email_magic_link` is disabled on Demo (410).
  contact:
    name: Raisd working group
    email: iman.suherman@raisd.co

servers:
  - url: https://sso.raisd.co
    description: UltaHost k3s Demo SSO
  - url: http://127.0.0.1:8090
    description: Local SSO (`npm start` in raisd-campus/sso)

tags:
  - name: Health
  - name: Auth
  - name: Session
  - name: Admin
  - name: Dev

paths:
  /health:
    get:
      tags: [Health]
      operationId: ssoHealth
      summary: Liveness
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, service]
                properties:
                  ok: { type: boolean }
                  service: { type: string, const: sso }
                  store: { type: string, enum: [memory, postgres] }

  /v1/meta:
    get:
      tags: [Health]
      operationId: ssoMeta
      summary: Channel catalogue and role keys
      responses:
        "200":
          description: Meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoMeta"

  /v1/auth/channels/email/start:
    post:
      tags: [Auth]
      operationId: emailMagicLinkStart
      summary: Start email magic-link login (disabled on Demo — returns 410)
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, returnUrl]
              properties:
                email: { type: string, format: email }
                returnUrl: { type: string, format: uri }
                campusId: { type: string }
      responses:
        "410":
          description: Magic-link channel disabled (use password + forgot-password)
        "202":
          description: Accepted (always, to avoid enumeration) when channel enabled
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: boolean, const: true }
                  message: { type: string }

  /v1/auth/channels/email/consume:
    get:
      tags: [Auth]
      operationId: emailMagicLinkConsume
      summary: Consume magic-link token (disabled on Demo — returns 410)
      deprecated: true
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "410":
          description: Magic-link channel disabled
        "302":
          description: Redirect to role picker or returnUrl with code
        "400":
          description: Invalid or expired token

  /v1/auth/channels/password/login:
    post:
      tags: [Auth]
      operationId: passwordLogin
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, returnUrl]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                returnUrl: { type: string, format: uri }
                campusId: { type: string }
      responses:
        "200":
          description: >
            Always includes redirectTo. Single-role continues with returnUrl?code=.
            Multi-role redirects to the campus landing portal picker
            (returnUrl?step=roles&session=…). Optional sessionId/roles fields may
            also be present for multi-role but clients must follow redirectTo.
          content:
            application/json:
              schema:
                type: object
                required: [redirectTo]
                properties:
                  redirectTo: { type: string, format: uri }
                  sessionId: { type: string }
                  returnUrl: { type: string, format: uri }
                  person: { $ref: "#/components/schemas/Person" }
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/RoleAssignment" }
        "401":
          description: Email or password incorrect
        "400":
          description: Invalid body or returnUrl

  /v1/auth/channels/passkey/register/options:
    post:
      tags: [Auth]
      operationId: passkeyRegisterOptions
      summary: Start passkey registration after email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, returnUrl]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                returnUrl: { type: string, format: uri }
      responses:
        "200":
          description: WebAuthn creation options
        "401":
          description: Email or password incorrect
        "400":
          description: Invalid body or returnUrl

  /v1/auth/channels/passkey/register/verify:
    post:
      tags: [Auth]
      operationId: passkeyRegisterVerify
      summary: Save a passkey and continue like password login
      responses:
        "200":
          description: redirectTo, same as password login
        "401":
          description: Passkey could not be verified

  /v1/auth/channels/passkey/login/options:
    post:
      tags: [Auth]
      operationId: passkeyLoginOptions
      summary: Start discoverable passkey sign-in
      responses:
        "200":
          description: WebAuthn request options

  /v1/auth/channels/passkey/login/verify:
    post:
      tags: [Auth]
      operationId: passkeyLoginVerify
      summary: Verify a passkey and continue like password login
      responses:
        "200":
          description: redirectTo, same as password login
        "401":
          description: Passkey is not registered or could not be verified

  /v1/auth/channels/password/forgot:
    post:
      tags: [Auth]
      operationId: passwordForgot
      summary: Request a password-reset email (no enumeration)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                returnUrl:
                  type: string
                  format: uri
                  description: Optional post-reset redirect (allowlisted campus or SSO login)
      responses:
        "200":
          description: Reset email sent when Notifications is configured
        "202":
          description: Accepted without revealing whether the email is registered
        "400":
          description: Invalid body
        "502":
          description: Email send failed

  /v1/auth/channels/password/reset:
    post:
      tags: [Auth]
      operationId: passwordReset
      summary: Consume password-reset token and set a new password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  returnUrl: { type: string, format: uri }
                  message: { type: string }
        "400":
          description: Invalid body or expired token

  /v1/oauth/token:
    post:
      tags: [Auth]
      operationId: oauthToken
      summary: Exchange authorization code or refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [grant_type, code]
                  properties:
                    grant_type: { type: string, const: authorization_code }
                    code: { type: string }
                - type: object
                  required: [grant_type, refresh_token]
                  properties:
                    grant_type: { type: string, const: refresh_token }
                    refresh_token: { type: string }
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid grant

  /v1/introspect:
    post:
      tags: [Auth]
      operationId: introspect
      summary: Introspect access token (Portal API / trusted callers)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Introspection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Introspection"

  /v1/me:
    get:
      tags: [Session]
      operationId: me
      summary: Current principal
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          description: Unauthorized

  /v1/me/roles:
    get:
      tags: [Session]
      operationId: myRoles
      summary: Role assignments for the current person
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: object
                required: [roles, activeRoleId]
                properties:
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/RoleAssignment" }
                  activeRoleId: { type: ["string", "null"] }

  /v1/session/active-role:
    post:
      tags: [Session]
      operationId: setActiveRole
      summary: Select or switch active role (issues new access token)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleAssignmentId]
              properties:
                roleAssignmentId: { type: string }
                campusId: { type: string }
      responses:
        "200":
          description: Updated tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /v1/auth/logout:
    post:
      tags: [Session]
      operationId: logout
      summary: Revoke session
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Logged out

  /v1/control/flow-reviewers:
    get:
      tags:
      - Admin
      operationId: listFlowReviewers
      summary: List live bindings and campus roles; active Control plus flows.configure
        required
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: configurationId
        schema:
          type: string
      responses:
        '200':
          description: Confirmed result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowReviewerDirectory'
        '403':
          description: Active Control and flows.configure required
    post:
      tags:
      - Admin
      operationId: saveFlowReviewers
      summary: Save immediate audited reviewer roles with revision and retry safeguards
      description: Eligible campus Admin Applicants role definitions only. Ordinary
        last-reviewer removal is rejected. Does not grant access. Security revocation
        remains possible.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/FlowReviewerTarget'
              - type: object
                required:
                - roleIds
                - expectedRevision
                - requestId
                properties:
                  roleIds:
                    type: array
                    uniqueItems: true
                    maxItems: 100
                    items:
                      type: string
                      minLength: 1
                  expectedRevision:
                    type: integer
                    minimum: 0
                  requestId:
                    type: string
                    minLength: 1
                    maxLength: 200
      responses:
        '200':
          description: Confirmed result
          content:
            application/json:
              schema:
                type: object
                required:
                - binding
                properties:
                  binding:
                    $ref: '#/components/schemas/FlowReviewerBinding'
        '400':
          description: Invalid typed input
        '403':
          description: Active Control and flows.configure required
        '409':
          description: Stale revision
        '422':
          description: Invalid role, empty coverage or conflicting retry
  /v1/internal/flow-reviewers:
    get:
      operationId: internalFlowReviewers
      summary: Service-only live reviewer directory
      security: []
      parameters:
      - in: header
        name: X-SSO-Service-Token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Confirmed result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowReviewerDirectory'
        '401':
          description: Invalid service token

  /v1/control/campuses:
    get:
      tags: [Admin]
      operationId: controlListCampuses
      summary: List Demo campuses with member and role counts (requires rbac.manage)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Campuses
          content:
            application/json:
              schema:
                type: object
                required: [campuses]
                properties:
                  campuses:
                    type: array
                    items: { $ref: "#/components/schemas/CampusSummary" }
        "403":
          description: Forbidden

  /v1/control/campuses/{campusId}/roles:
    get:
      tags: [Admin]
      operationId: controlListCampusRoles
      summary: List custom roles for a campus (requires rbac.manage)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: campusId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Roles plus permission catalog for the matrix UI
          content:
            application/json:
              schema:
                type: object
                required: [roles, catalog]
                properties:
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/CustomRole" }
                  catalog:
                    $ref: "#/components/schemas/PermissionCatalog"
        "403":
          description: Forbidden
        "404":
          description: Unknown campus
    post:
      tags: [Admin]
      operationId: controlCreateCampusRole
      summary: Create a custom role on a campus (requires rbac.manage)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: campusId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permissions]
              description: Provide entryRoleKeys, or entryRoleKey when the role enters one portal.
              properties:
                name: { type: string }
                description: { type: string }
                entryRoleKey:
                  type: string
                  enum: [admin, lecturer, student]
                  description: Single portal. Ignored when entryRoleKeys is set.
                entryRoleKeys:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  description: Portals this role may enter. At least one of entryRoleKey or entryRoleKeys is required.
                  items:
                    type: string
                    enum: [admin, lecturer, student]
                permissions:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role: { $ref: "#/components/schemas/CustomRole" }
        "400":
          description: Invalid body
        "403":
          description: Forbidden
        "404":
          description: Unknown campus

  /v1/control/campuses/{campusId}/roles/{roleId}:
    get:
      tags: [Admin]
      operationId: controlGetCampusRole
      summary: Get one custom role (requires rbac.manage)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: campusId
          in: path
          required: true
          schema: { type: string }
        - name: roleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema:
                type: object
                required: [role, catalog]
                properties:
                  role: { $ref: "#/components/schemas/CustomRole" }
                  catalog: { $ref: "#/components/schemas/PermissionCatalog" }
        "403":
          description: Forbidden
        "404":
          description: Not found
    put:
      tags: [Admin]
      operationId: controlUpdateCampusRole
      summary: Update a custom role (built-in Campus Admin is not editable)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: campusId
          in: path
          required: true
          schema: { type: string }
        - name: roleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                entryRoleKey:
                  type: string
                  enum: [admin, lecturer, student]
                  description: Replaces the portal list with this single portal. Ignored when entryRoleKeys is set.
                entryRoleKeys:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  description: Portals this role may enter.
                  items:
                    type: string
                    enum: [admin, lecturer, student]
                permissions:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role: { $ref: "#/components/schemas/CustomRole" }
        "400":
          description: Invalid body or built-in role
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      tags: [Admin]
      operationId: controlDeleteCampusRole
      summary: Delete a custom role (blocked while members remain; built-in not deletable)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: campusId
          in: path
          required: true
          schema: { type: string }
        - name: roleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "400":
          description: Built-in or still in use
        "403":
          description: Forbidden
        "404":
          description: Not found

  /v1/control/campuses/{campusId}/members:
    get:
      tags: [Admin]
      operationId: controlListCampusMembers
      summary: List Control memberships on this campus — Admin or custom roles only (requires rbac.manage)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: campusId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/CampusMember" }
        "403":
          description: Forbidden
        "404":
          description: Unknown campus
    post:
      tags: [Admin]
      operationId: controlAddCampusMember
      summary: Add or update a campus membership (requires rbac.manage)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: campusId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, customRoleId]
              properties:
                email: { type: string, format: email }
                displayName: { type: string }
                customRoleId: { type: string }
      responses:
        "200":
          description: Membership upserted
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: "#/components/schemas/CampusMember" }
        "400":
          description: Invalid body or role/campus mismatch
        "403":
          description: Forbidden
        "404":
          description: Unknown campus or role

  /v1/control/campuses/{campusId}/members/{personId}:
    delete:
      tags: [Admin]
      operationId: controlRemoveCampusMember
      summary: Remove this campus’s role assignments for a person (requires rbac.manage)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: campusId
          in: path
          required: true
          schema: { type: string }
        - name: personId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated person
        "403":
          description: Forbidden
        "404":
          description: Not found

  /v1/access/people:
    get:
      tags: [Admin]
      operationId: accessListPeople
      summary: List people on the active Admin campuses (requires sso.manage_learners)
      description: Roles whose campuses are outside the active Admin role are omitted. A Lesotho Admin does not see Botswana learner access.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: People (full role list including learner presets)
          content:
            application/json:
              schema:
                type: object
                required: [people]
                properties:
                  people:
                    type: array
                    items: { $ref: "#/components/schemas/PersonSummary" }
        "403":
          description: Forbidden
    post:
      tags: [Admin]
      operationId: accessCreatePerson
      summary: Create a person with a fixed Access preset on the active Admin campuses
      description: >
        campusIds must belong to the active Admin role. Client permissions are ignored.
        The sso_admin desk is rejected, so Campus Admin cannot grant rbac.manage.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, displayName, assignments]
              properties:
                email: { type: string, format: email }
                displayName: { type: string }
                assignments:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [campusIds]
                    properties:
                      preset:
                        type: string
                        enum: [applicant, student, staff, lecturer]
                        description: Fixed permission set; client permissions are ignored
                      roleKey:
                        type: string
                        enum: [applicant, student, lecturer]
                        description: Optional when preset is set; used to infer preset on revoke
                      campusIds:
                        type: array
                        items: { type: string }
                      deskTags:
                        type: array
                        items: { $ref: "#/components/schemas/DeskTag" }
      responses:
        "201":
          description: Created
        "403":
          description: Forbidden
        "409":
          description: Email already registered

  /v1/access/people/{personId}/roles:
    put:
      tags: [Admin]
      operationId: accessSetRoles
      summary: Replace learner presets on the active Admin campuses
      description: >
        Learner assignments on other campuses are kept and omitted from the response.
        Admin, Control, and custom-role rows are preserved. The sso_admin desk is rejected.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    required: [campusIds]
                    properties:
                      preset:
                        type: string
                        enum: [applicant, student, staff, lecturer]
                      roleKey: { type: string }
                      campusIds:
                        type: array
                        items: { type: string }
                      deskTags:
                        type: array
                        items: { $ref: "#/components/schemas/DeskTag" }
      responses:
        "200":
          description: Updated learner assignments
        "403":
          description: Forbidden

  /v1/control/people:
    get:
      tags: [Admin]
      operationId: adminListPeople
      summary: List people for Control (requires rbac.manage; Admin/custom roles only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                type: object
                required: [people]
                properties:
                  people:
                    type: array
                    items: { $ref: "#/components/schemas/PersonSummary" }
        "403":
          description: Forbidden
    post:
      tags: [Admin]
      operationId: adminCreatePerson
      summary: Create a person with admin or custom-role membership (Control only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, displayName]
              properties:
                email: { type: string, format: email }
                displayName: { type: string }
                assignments:
                  type: array
                  items:
                    type: object
                    required: [roleKey, campusIds]
                    properties:
                      roleKey:
                        type: string
                        enum: [admin]
                      campusIds:
                        type: array
                        items: { type: string }
                      deskTags:
                        type: array
                        items: { $ref: "#/components/schemas/DeskTag" }
                      customRoleId: { type: string }
                      permissions:
                        type: array
                        items: { type: string }
                cmsPersonRef:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Created
        "403":
          description: Forbidden
        "409":
          description: Email already registered

  /v1/internal/people/upsert:
    post:
      tags: [Internal]
      operationId: internalUpsertPerson
      summary: Service-to-service upsert by email (SSO_SERVICE_TOKEN)
      security: []
      parameters:
        - name: x-sso-service-token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, displayName, roleKey]
              properties:
                email: { type: string, format: email }
                displayName: { type: string }
                roleKey:
                  type: string
                  enum: [applicant, student, lecturer, admin, control]
                campusIds:
                  type: array
                  items: { type: string }
                deskTags:
                  type: array
                  items: { $ref: "#/components/schemas/DeskTag" }
      responses:
        "200":
          description: Upserted person
        "401":
          description: Unauthorized

  /v1/control/people/{personId}/roles:
    put:
      tags: [Admin]
      operationId: adminSetRoles
      summary: Replace Control-scoped assignments (admin/customRoleId); learner presets preserved server-side
      description: >
        Requires rbac.manage. Campus Admin learner writes use PUT /v1/access/people/{personId}/roles.
        Requested rows must be admin or include customRoleId; existing learner presets are kept.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    required: [roleKey, campusIds]
                    properties:
                      roleKey: { type: string }
                      campusIds:
                        type: array
                        items: { type: string }
                      deskTags:
                        type: array
                        items: { $ref: "#/components/schemas/DeskTag" }
                      customRoleId: { type: string }
                      permissions:
                        type: array
                        items: { type: string }
      responses:
        "200":
          description: Updated Control assignments
        "403":
          description: Forbidden

  /v1/control/audit:
    get:
      tags: [Admin]
      operationId: adminAudit
      summary: Control audit events (paginated, optional date range)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
          description: Page size (max 200)
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: from
          in: query
          schema: { type: string }
          description: Inclusive lower bound (ISO date-time or YYYY-MM-DD UTC)
        - name: to
          in: query
          schema: { type: string }
          description: Inclusive upper bound (ISO date-time or YYYY-MM-DD UTC)
        - name: q
          in: query
          schema: { type: string }
          description: User search — matches actor or subject email, display name, or person id
        - name: access
          in: query
          schema: { type: string }
          description: Access level filter — admin, custom, or a roleKey
        - name: campusId
          in: query
          schema: { type: string }
          description: Campus id (e.g. campus-lesotho) present on the event or assignments
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [events, total, limit, offset]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  total: { type: integer, minimum: 0 }
                  limit: { type: integer }
                  offset: { type: integer }

  /v1/dev/last-magic-link:
    get:
      tags: [Dev]
      operationId: devLastMagicLink
      summary: Demo-only last magic link (when SMTP unset)
      deprecated: true
      responses:
        "200":
          description: Last link
        "404":
          description: None or disabled in production

  /v1/dev/last-password-reset:
    get:
      tags: [Dev]
      operationId: devLastPasswordReset
      summary: Demo-only last password-reset link (when SMTP unset)
      responses:
        "200":
          description: Last reset link
        "404":
          description: None or disabled in production

  /v1/internal/learners/transition:
    post:
      summary: Durable learner role transition
      description: Trusted service only. Bind to immutable SSO person ID. Replace Applicant
        with Student; preserve Staff/Control and passwords; revoke learner sessions/codes.
        Reset requires a registered unlinked Cyberjaya Demo identity and next generation.
        Persistence failure is not success.
      parameters:
      - in: header
        name: x-sso-service-token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                personId:
                  type: string
                operationId:
                  type: string
                applicationId:
                  type: string
                campusId:
                  type: string
                generation:
                  type: integer
                  minimum: 1
                reset:
                  type: boolean
                dryRun:
                  type: boolean
                  description: Validate registered Demo reset eligibility without changing identity, sessions or generation.
              required:
              - personId
              - operationId
              - applicationId
              - campusId
              - generation
      responses:
        '200':
          description: Durable transition confirmed
        '401':
          description: Invalid trusted service credential
        '409':
          description: Identity/generation conflict or persistence failure

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  schemas:
    SsoMeta:
      type: object
      required: [service, version, channels, roleKeys]
      properties:
        service: { type: string, const: sso }
        version: { type: string }
        channels:
          type: array
          items:
            type: object
            required: [id, enabled]
            properties:
              id: { type: string }
              enabled: { type: boolean }
        roleKeys:
          type: array
          items: { type: string }

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer }
        active_role:
          $ref: "#/components/schemas/RoleAssignment"

    FlowReviewerTarget:
      oneOf:
      - $ref: '#/components/schemas/AdmissionsFlowReviewerTarget'
      - $ref: '#/components/schemas/AcademicFlowReviewerTarget'
    AcademicFlowReviewerTarget:
      type: object
      required: [flowId, configurationId, campusId, stepId]
      properties:
        flowId: {type: string, const: academic-curriculum}
        configurationId: {type: string, pattern: '^[a-zA-Z0-9:_-]{1,160}$'}
        campusId: {type: string, pattern: '^campus-[a-z-]+$'}
        stepId: {type: string, const: curriculum-review}
    AdmissionsFlowReviewerTarget:
      type: object
      required:
      - configurationId
      - campusId
      - studentType
      - stepId
      properties:
        configurationId:
          type: string
          pattern: ^[a-zA-Z0-9:_-]{1,160}$
        campusId:
          type: string
          pattern: ^campus-[a-z-]+$
        studentType:
          type: string
          enum:
          - local
          - international
        stepId:
          type: string
          enum:
          - eligibility
          - registration-fee
          - english
          - offer
          - signed-offer
          - tuition
          - entry
          - arrival
          - medical
          - endorsement
          - international-registration
          - deadlines
    FlowReviewerBinding:
      allOf:
      - $ref: '#/components/schemas/FlowReviewerTarget'
      - type: object
        required:
        - roleIds
        - revision
        - updatedAt
        - updatedBy
        properties:
          roleIds:
            type: array
            uniqueItems: true
            maxItems: 100
            items:
              type: string
              minLength: 1
          roleNames:
            type: array
            items:
              type: string
            description: Current names for presentation only
          revision:
            type: integer
            minimum: 1
          updatedAt:
            type: string
            format: date-time
          updatedBy:
            type: string
    FlowReviewerDirectory:
      type: object
      required:
      - bindings
      - roles
      properties:
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/FlowReviewerBinding'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/CustomRole'

    Introspection:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        personId: { type: string }
        userNumber:
          type: string
          pattern: '^[1-9]\d{7,14}$'
          readOnly: true
          description: Permanent SSO-assigned numeric User ID, retained across portal roles and Demo resets.
        email: { type: string }
        displayName: { type: string }
        roleKeys:
          type: array
          items: { type: string }
          description: All assigned role keys for account display only; authorization uses the active role.
        roleKey: { type: string }
        roleAssignmentId: { type: string }
        roleDefinitionId: {type: string, description: Stable custom role definition}
        roleDefinitionIds:
          type: object
          additionalProperties: {type: string}
          description: Active campus role definitions including built-in Campus Admin
        reviewerBindings:
          type: array
          items: {$ref: '#/components/schemas/FlowReviewerBinding'}
        campusIds:
          type: array
          items: { type: string }
        deskTags:
          type: array
          items: { $ref: "#/components/schemas/DeskTag" }
        permissions:
          type: array
          items: { type: string }
        exp: { type: integer }

    RoleAssignment:
      type: object
      required: [id, roleKey, campusIds, permissions]
      properties:
        id: { type: string }
        roleKey: { type: string }
        campusIds:
          type: array
          items: { type: string }
        deskTags:
          type: array
          items: { $ref: "#/components/schemas/DeskTag" }
        customRoleId: { type: string }
        entryRoleKeys:
          type: array
          description: Portals a custom role may enter. Sign-in offers one choice per portal.
          items:
            type: string
            enum: [admin, lecturer, student]
        permissions:
          type: array
          items: { type: string }
        portalHostHint: { type: string }

    CampusSummary:
      type: object
      required: [id, slug, label, memberCount, roleCount]
      properties:
        id: { type: string }
        slug: { type: string }
        label: { type: string }
        memberCount: { type: integer }
        roleCount: { type: integer }

    CustomRole:
      type: object
      required: [id, campusId, name, entryRoleKey, entryRoleKeys, permissions]
      properties:
        id: { type: string }
        campusId: { type: string }
        name: { type: string }
        description: { type: string }
        entryRoleKey:
          type: string
          enum: [admin, lecturer, student]
          description: First portal in entryRoleKeys. Kept for older clients.
        entryRoleKeys:
          type: array
          minItems: 1
          uniqueItems: true
          description: Portals this role may enter. More than one is mixed access.
          items:
            type: string
            enum: [admin, lecturer, student]
        permissions:
          type: array
          items: { type: string }
        builtIn:
          type: string
          enum: [campus_admin]
          description: Present on the seeded full Campus Admin role (not deletable or editable)

    CampusMember:
      type: object
      required: [personId, email, displayName, assignments]
      properties:
        personId: { type: string }
        email: { type: string }
        displayName: { type: string }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }

    PermissionCatalogNode:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        children:
          type: array
          items: { $ref: "#/components/schemas/PermissionCatalogNode" }

    PermissionCatalog:
      type: object
      required: [admin, lecturer, student]
      properties:
        admin:
          type: array
          items: { $ref: "#/components/schemas/PermissionCatalogNode" }
        lecturer:
          type: array
          items: { $ref: "#/components/schemas/PermissionCatalogNode" }
        student:
          type: array
          items: { $ref: "#/components/schemas/PermissionCatalogNode" }

    Principal:
      type: object
      required: [personId, email, displayName, roles]
      properties:
        personId: { type: string }
        email: { type: string }
        displayName: { type: string }
        cmsPersonRef: { type: ["string", "null"] }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }
        activeRoleId: { type: ["string", "null"] }

    Person:
      type: object
      required: [personId, email, displayName, cmsPersonRef, roles]
      properties:
        personId: { type: string }
        userNumber:
          type: string
          pattern: '^[1-9]\d{7,14}$'
          readOnly: true
          description: Permanent SSO-assigned numeric User ID, retained across portal roles and Demo resets.
        email: { type: string, format: email }
        displayName: { type: string }
        cmsPersonRef: { type: ["string", "null"] }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }

        learnerTransition:
          type: object
          required: [campusId, generation, operationId, applicationId, state]
          properties:
            campusId: { type: string }
            generation: { type: integer, minimum: 1 }
            operationId: { type: string }
            applicationId: { type: [string, 'null'] }
            state: { type: string, enum: [applicant, student] }

    PersonSummary:
      type: object
      required: [personId, email, displayName, roles]
      properties:
        personId: { type: string }
        email: { type: string }
        displayName: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }

    AuditEvent:
      type: object
      required: [id, at, actorPersonId, action]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actorPersonId: { type: string }
        action: { type: string }
        detail: { type: object, additionalProperties: true }

    DeskTag:
      type: string
      enum: [bursary, registry, qa, faculty, sso_admin, international_office, student_services]
