name: Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - openapi.yaml
      - index.html
      - diagrams/**
      - ai/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@1
      - name: Lint openapi.yaml
        run: redocly lint openapi.yaml --extends=minimal

  pages:
    name: Deploy GitHub Pages
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html openapi.yaml _site/
          cp -R diagrams _site/diagrams
          cp -R ai _site/ai
          if [ -d sdd ]; then cp -R sdd _site/sdd; fi
          test -f _site/diagrams/erd.html
          test -f _site/diagrams/dfd.html
          test -f _site/diagrams/old-cms/index.html
          test -f _site/diagrams/old-cms/comparison.html
          test -f _site/ai/index.html
          test -f _site/sdd/15-nomenclature.md
          test -f _site/sdd/11-capability-catalog.md
          test -f _site/sdd/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
